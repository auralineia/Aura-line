<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">
  <title>Aura Line</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050507;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #authScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(130, 100, 255, 0.18),
          transparent 35%
        ),
        #050507;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .auth-core {
      width: 115px;
      height: 115px;

      margin: 0 auto 30px;

      border-radius: 50%;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-ring {
      position: absolute;
      inset: 0;

      border-radius: 50%;
      border: 2px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff79d1,
          #a887ff,
          #66d8ff,
          #73ffd1,
          #ffe27a,
          #ff8ac8,
          #a887ff,
          #ff79d1
        ) border-box;

      animation:
        colorSpin 6s linear infinite,
        auraPulse 4s ease-in-out infinite;

      box-shadow:
        0 0 20px rgba(255,120,210,.25),
        0 0 45px rgba(130,100,255,.20),
        0 0 75px rgba(90,210,255,.12);
    }

    .auth-core-dot {
      width: 27px;
      height: 27px;

      border-radius: 50%;
      background: white;

      box-shadow:
        0 0 12px white,
        0 0 30px rgba(255,255,255,.95),
        0 0 60px rgba(170,140,255,.9);
    }

    .auth-title {
      font-size: 35px;
      font-weight: 500;
      letter-spacing: 8px;
      margin-bottom: 10px;
    }

    .auth-subtitle {
      color: rgba(255,255,255,.48);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .auth-input {
      width: 100%;
      height: 52px;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 17px;

      background:
        rgba(255,255,255,.06);

      color: white;

      outline: none;

      padding:
        0
        16px;

      font-size: 15px;

      backdrop-filter: blur(15px);
    }

    .auth-input:focus {
      border-color:
        rgba(170,140,255,.55);

      box-shadow:
        0 0 25px
        rgba(130,100,255,.10);
    }

    .auth-input::placeholder {
      color: rgba(255,255,255,.30);
    }

    .auth-button {
      width: 100%;
      height: 52px;

      border: none;
      border-radius: 17px;

      background: white;
      color: #07070a;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      margin-top: 4px;
    }

    .auth-button:disabled {
      opacity: .45;
    }

    .auth-switch {
      margin-top: 20px;

      border: none;
      background: none;

      color: rgba(255,255,255,.55);

      font-size: 13px;

      cursor: pointer;
    }

    .auth-switch span {
      color: white;
    }

    .auth-error {
      min-height: 18px;

      margin-top: 12px;

      color: #ff9dba;

      font-size: 12px;
      line-height: 1.4;
    }

    .auth-success {
      color: #9fffd2;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(130, 100, 255, 0.16),
          transparent 40%
        ),
        #050507;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 82px;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        max(16px, env(safe-area-inset-top))
        18px
        12px;

      background:
        linear-gradient(
          to bottom,
          rgba(5,5,7,.96),
          rgba(5,5,7,.72),
          transparent
        );

      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-core {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff7bd5,
          #9d8cff,
          #65d9ff,
          #8affc1,
          #ffdc7a,
          #ff7bd5
        ) border-box;

      animation:
        colorSpin 5s linear infinite,
        miniPulse 3s ease-in-out infinite;

      box-shadow:
        0 0 15px rgba(150,120,255,.25);
    }

    .mini-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: white;

      box-shadow:
        0 0 10px white,
        0 0 20px rgba(160,130,255,.9);
    }

    .brand-name {
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 500;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.7);
      cursor: pointer;
      font-size: 19px;
    }

    .chat {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        105px
        18px
        120px;

      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 10px;
    }

    .welcome {
      min-height: calc(100vh - 220px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 30px 0;
    }

    .aura-core {
      width: 150px;
      height: 150px;
      margin-bottom: 34px;

      border-radius: 50%;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff79d1,
          #a887ff,
          #66d8ff,
          #73ffd1,
          #ffe27a,
          #ff8ac8,
          #a887ff,
          #ff79d1
        ) border-box;

      animation:
        colorSpin 6s linear infinite,
        auraPulse 4s ease-in-out infinite;

      box-shadow:
        0 0 12px rgba(255,120,210,.25),
        0 0 30px rgba(130,100,255,.20),
        0 0 55px rgba(90,210,255,.12);
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);

      box-shadow:
        inset 0 0 20px rgba(255,255,255,.05);
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          transparent,
          rgba(255,100,210,.45),
          transparent,
          rgba(90,210,255,.35),
          transparent,
          rgba(150,120,255,.4),
          transparent
        );

      filter: blur(12px);
      opacity: .55;
      z-index: -1;

      animation: colorSpin 8s linear infinite;
    }

    .core {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: white;

      box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,.95),
        0 0 50px rgba(170,140,255,.9),
        0 0 85px rgba(110,170,255,.5);

      animation: corePulse 3s ease-in-out infinite;
    }

    h1 {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 8px;
      margin-bottom: 14px;
    }

    .tagline {
      color: rgba(255,255,255,.62);
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 30px;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
      animation: messageAppear .35s ease;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.aura {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 86%;
    }

    .bubble {
      position: relative;
      padding: 14px 16px;

      border-radius: 20px;

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: rgba(255,255,255,.10);

      border:
        1px solid
        rgba(255,255,255,.08);

      border-bottom-right-radius: 6px;

      color:
        rgba(255,255,255,.94);
    }

    .message.aura .bubble {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.055),
          rgba(130,100,255,.055)
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      border-bottom-left-radius: 6px;

      color:
        rgba(255,255,255,.88);
    }

    .aura-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255,255,255,.35);

      margin-bottom: 7px;
      padding-left: 4px;
    }

    .stream-word {
      display: inline;
      opacity: 0;
      filter: blur(5px);

      animation:
        wordReveal .20s ease forwards;
    }

    .mist {
      position: absolute;

      width: 120px;
      height: 65px;

      left: 0;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      pointer-events: none;

      background:
        conic-gradient(
          from 0deg,
          rgba(255,80,200,0),
          rgba(255,80,200,.45),
          rgba(140,100,255,.45),
          rgba(70,210,255,.42),
          rgba(100,255,210,.35),
          rgba(255,220,100,.35),
          rgba(255,80,200,0)
        );

      filter: blur(20px);

      opacity: 0;

      mix-blend-mode: screen;

      transition:
        left .12s linear,
        opacity .25s ease;
    }

    .streaming .mist {
      opacity: .75;

      animation:
        mistRotate 2.5s linear infinite,
        mistPulse 1.2s ease-in-out infinite;
    }

    .finished .mist {
      opacity: 0;
    }

    .thinking {
      display: flex;
      align-items: center;
      gap: 9px;

      color: rgba(255,255,255,.42);
      font-size: 13px;

      margin:
        12px
        0
        20px
        5px;
    }

    .thinking-core {
      width: 20px;
      height: 20px;
      border-radius: 50%;

      border: 1px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff7bd5,
          #8e7cff,
          #65d9ff,
          #ff7bd5
        ) border-box;

      animation:
        colorSpin 1.5s linear infinite,
        thinkingPulse 1s ease-in-out infinite;
    }

    .composer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 30;

      padding:
        12px
        16px
        max(14px, env(safe-area-inset-bottom));

      background:
        linear-gradient(
          to top,
          #050507 60%,
          rgba(5,5,7,.94) 78%,
          transparent
        );
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 9px;

      max-width: 700px;
      margin: 0 auto;
    }

    #messageInput {
      flex: 1;

      min-height: 52px;
      max-height: 130px;

      resize: none;

      border-radius: 20px;

      border:
        1px solid
        rgba(255,255,255,.11);

      background:
        rgba(255,255,255,.065);

      color: white;

      outline: none;

      padding:
        15px
        17px;

      font-size: 15px;
      line-height: 1.4;

      backdrop-filter: blur(15px);
    }

    #messageInput::placeholder {
      color: rgba(255,255,255,.30);
    }

    #sendButton {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      border: none;
      border-radius: 18px;

      background: white;
      color: #07070a;

      cursor: pointer;
      font-size: 19px;

      transition:
        transform .18s,
        opacity .18s;
    }

    #sendButton:active {
      transform: scale(.94);
    }

    #sendButton:disabled {
      opacity: .35;
      cursor: default;
    }

    @keyframes colorSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes auraPulse {
      0%,100% {
        transform: scale(1);
        filter: brightness(.85);
      }

      50% {
        transform: scale(1.045);
        filter: brightness(1.25);
      }
    }

    @keyframes corePulse {
      0%,100% {
        transform: scale(.85);
        opacity: .88;
      }

      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    @keyframes miniPulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes thinkingPulse {
      0%,100% {
        transform: scale(.75);
        opacity: .45;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes wordReveal {
      from {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes mistRotate {
      from {
        transform:
          translate(-50%, -50%)
          rotate(0deg)
          scale(.9);
      }

      to {
        transform:
          translate(-50%, -50%)
          rotate(360deg)
          scale(1.12);
      }
    }

    @keyframes mistPulse {
      0%,100% {
        filter: blur(20px) brightness(.8);
      }

      50% {
        filter: blur(28px) brightness(1.35);
      }
    }

    @media (max-width: 600px) {

      .chat {
        padding-left: 14px;
        padding-right: 14px;
      }

      .message-content {
        max-width: 90%;
      }

      h1 {
        font-size: 34px;
      }

      .aura-core {
        width: 135px;
        height: 135px;
      }

      .core {
        width: 28px;
        height: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TELA DE LOGIN
  ========================== -->

  <div id="authScreen">

    <div class="auth-box">

      <div class="auth-core">
        <div class="auth-ring"></div>
        <div class="auth-core-dot"></div>
      </div>

      <div class="auth-title">
        AURA
      </div>

      <div class="auth-subtitle">
        Entre para continuar suas histórias.
      </div>

      <div class="auth-form">

        <input
          id="authEmail"
          class="auth-input"
          type="email"
          placeholder="Seu e-mail"
          autocomplete="email"
        >

        <input
          id="authPassword"
          class="auth-input"
          type="password"
          placeholder="Sua senha"
          autocomplete="current-password"
        >

        <button
          id="authButton"
          class="auth-button"
          onclick="handleAuth()"
        >
          Entrar
        </button>

      </div>

      <div
        id="authMessage"
        class="auth-error"
      ></div>

      <button
        id="authSwitch"
        class="auth-switch"
        onclick="toggleAuthMode()"
      >
        Ainda não tenho uma conta.
        <span>Criar conta</span>
      </button>

    </div>

  </div>


  <!-- =========================
       APP
  ========================== -->

  <main
    id="app"
    class="app"
    style="display:none;"
  >

    <header class="topbar">

      <div class="brand">

        <div class="mini-core">
          <div class="mini-ring"></div>
          <div class="mini-dot"></div>
        </div>

        <div class="brand-name">
          AURA
        </div>

      </div>

      <button
        class="menu-button"
        onclick="newStory()"
        aria-label="Nova história"
      >
        +
      </button>

    </header>


    <section
      id="chat"
      class="chat"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <div class="aura-core">

          <div class="ring"></div>

          <div class="core"></div>

        </div>

        <h1>AURA</h1>

        <p class="tagline">
          Sua história começa aqui.
          <br>
          Crie. Escolha. Viva.
        </p>

      </div>

    </section>


    <footer class="composer">

      <div class="composer-inner">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Comece uma história..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendButton"
          onclick="sendMessage()"
          aria-label="Enviar"
        >
          ↑
        </button>

      </div>

    </footer>

  </main>


  <script>

    /* =====================================================
       SUPABASE
       COLOQUE AQUI SEUS DADOS PÚBLICOS
    ===================================================== */

    const SUPABASE_URL =
      "COLE_SEU_PROJECT_URL_AQUI";

    const SUPABASE_KEY =
      "COLE_SUA_CHAVE_PUBLICA_AQUI";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       AUTENTICAÇÃO
    ===================================================== */

    let authMode = "login";


    function toggleAuthMode() {

      const button =
        document.getElementById("authButton");

      const switchButton =
        document.getElementById("authSwitch");

      const subtitle =
        document.querySelector(".auth-subtitle");

      const message =
        document.getElementById("authMessage");

      message.textContent = "";
      message.className = "auth-error";


      if (authMode === "login") {

        authMode = "signup";

        button.textContent =
          "Criar conta";

        subtitle.textContent =
          "Crie sua conta e comece sua história.";

        switchButton.innerHTML =
          'Já tenho uma conta. <span>Entrar</span>';

      } else {

        authMode = "login";

        button.textContent =
          "Entrar";

        subtitle.textContent =
          "Entre para continuar suas histórias.";

        switchButton.innerHTML =
          'Ainda não tenho uma conta. <span>Criar conta</span>';

      }
    }


    async function handleAuth() {

      const email =
        document
          .getElementById("authEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("authPassword")
          .value;

      const button =
        document.getElementById("authButton");

      const message =
        document.getElementById("authMessage");


      message.textContent = "";
      message.className = "auth-error";


      if (!email || !password) {

        message.textContent =
          "Preencha seu e-mail e sua senha.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "A senha precisa ter pelo menos 6 caracteres.";

        return;
      }


      button.disabled = true;

      button.textContent =
        authMode === "login"
          ? "Entrando..."
          : "Criando...";


      try {

        if (authMode === "signup") {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({
              email,
              password
            });


          if (error) {
            throw error;
          }


          if (data.session) {

            showApp();

          } else {

            message.className =
              "auth-error auth-success";

            message.textContent =
              "Conta criada. Verifique seu e-mail para confirmar o cadastro.";

          }

        } else {

          const {
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });


          if (error) {
            throw error;
          }


          showApp();
        }


      } catch (error) {

        console.error(error);

        message.textContent =
          translateAuthError(
            error.message
          );

      } finally {

        button.disabled = false;

        button.textContent =
          authMode === "login"
            ? "Entrar"
            : "Criar conta";
      }
    }


    function translateAuthError(error) {

      if (!error) {
        return "Não foi possível continuar.";
      }

      if (
        error.toLowerCase().includes(
          "invalid login credentials"
        )
      ) {
        return "E-mail ou senha incorretos.";
      }

      if (
        error.toLowerCase().includes(
          "user already registered"
        )
      ) {
        return "Esse e-mail já possui uma conta.";
      }

      if (
        error.toLowerCase().includes(
          "password"
        )
      ) {
        return "Verifique sua senha.";
      }

      return error;
    }


    function showApp() {

      document.getElementById(
        "authScreen"
      ).style.display = "none";

      document.getElementById(
        "app"
      ).style.display = "block";

      setTimeout(() => {
        input.focus();
      }, 100);
    }


    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        showApp();

      } else {

        document.getElementById(
          "authScreen"
        ).style.display = "flex";

      }
    }


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {
          showApp();
        }

      }
    );


    /* =====================================================
       CHAT
    ===================================================== */

    let conversation = [];

    let isThinking = false;

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");


    async function sendMessage() {

      if (isThinking) {
        return;
      }

      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      const currentWelcome =
        document.getElementById("welcome");

      if (currentWelcome) {
        currentWelcome.remove();
      }

      addUserMessage(message);

      conversation.push({
        role: "user",
        content: message
      });

      input.value = "";

      resizeInput();

      setThinking(true);


      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                message:
                  message,

                history:
                  conversation.slice(0, -1)

              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erro ao conversar com a Aura"
          );

        }


        conversation.push({
          role: "assistant",
          content: data.reply
        });


        setThinking(false);

        await streamAura(
          data.reply
        );


      } catch (error) {

        console.error(error);

        setThinking(false);

        addAuraInstant(
          "Não consegui responder agora. Tente novamente em alguns instantes."
        );
      }
    }


    function addUserMessage(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message user";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      content.appendChild(
        bubble
      );

      wrapper.appendChild(
        content
      );

      chat.appendChild(
        wrapper
      );

      scrollToBottom();
    }


    function addAuraInstant(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message aura";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      const label =
        document.createElement("div");

      label.className =
        "aura-label";

      label.textContent =
        "AURA";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      content.appendChild(
        label
      );

      content.appendChild(
        bubble
      );

      wrapper.appendChild(
        content
      );

      chat.appendChild(
        wrapper
      );

      scrollToBottom();
    }


    async function streamAura(text) {

      isThinking = true;

      sendButton.disabled =
        true;


      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message aura streaming";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      const label =
        document.createElement("div");

      label.className =
        "aura-label";

      label.textContent =
        "AURA";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      const mist =
        document.createElement("div");

      mist.className =
        "mist";


      bubble.appendChild(
        mist
      );

      content.appendChild(
        label
      );

      content.appendChild(
        bubble
      );

      wrapper.appendChild(
        content
      );

      chat.appendChild(
        wrapper
      );


      const parts =
        text.split(/(\s+)/);


      const words =
        parts.filter(
          part =>
            part.trim().length > 0
        );


      let wordNumber = 0;


      for (
        const part of parts
      ) {

        if (!part) {
          continue;
        }


        if (
          part.trim() === ""
        ) {

          const space =
            document.createTextNode(
              part
            );

          bubble.appendChild(
            space
          );

          continue;
        }


        const word =
          document.createElement(
            "span"
          );

        word.className =
          "stream-word";

        word.textContent =
          part;


        bubble.appendChild(
          word
        );


        wordNumber++;


        const progress =
          wordNumber /
          words.length;


        mist.style.left =
          `${Math.min(
            8 + progress * 84,
            92
          )}%`;


        let delay = 105;


        if (
          part.endsWith(".") ||
          part.endsWith("!") ||
          part.endsWith("?")
        ) {

          delay = 360;

        } else if (
          part.endsWith(",") ||
          part.endsWith(";") ||
          part.endsWith(":")
        ) {

          delay = 210;
        }


        scrollToBottom();

        await wait(delay);
      }


      wrapper.classList.remove(
        "streaming"
      );

      wrapper.classList.add(
        "finished"
      );


      await wait(700);


      isThinking = false;

      sendButton.disabled =
        false;

      scrollToBottom();
    }


    function wait(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );
    }


    function setThinking(
      thinking
    ) {

      isThinking =
        thinking;

      sendButton.disabled =
        thinking;


      const old =
        document.getElementById(
          "thinking"
        );


      if (old) {
        old.remove();
      }


      if (!thinking) {
        return;
      }


      const element =
        document.createElement(
          "div"
        );

      element.id =
        "thinking";

      element.className =
        "thinking";


      element.innerHTML = `

        <div class="thinking-core"></div>

        <span>
          A Aura está pensando...
        </span>

      `;


      chat.appendChild(
        element
      );

      scrollToBottom();
    }


    function scrollToBottom() {

      requestAnimationFrame(
        () => {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );
    }


    input.addEventListener(
      "input",
      resizeInput
    );


    function resizeInput() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          130
        ) + "px";
    }


    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );


    function newStory() {

      conversation = [];


      chat.innerHTML = `

        <div
          id="welcome"
          class="welcome"
        >

          <div class="aura-core">

            <div class="ring"></div>

            <div class="core"></div>

          </div>

          <h1>AURA</h1>

          <p class="tagline">
            Sua história começa aqui.
            <br>
            Crie. Escolha. Viva.
          </p>

        </div>

      `;


      input.value = "";

      resizeInput();

      input.placeholder =
        "Comece uma nova história...";

      input.focus();
    }


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    checkSession();

  </script>

</body>
</html>
