<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Line</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #15151d 0%, #08080c 42%, #030304 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px;
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(130, 100, 255, 0.10);
      filter: blur(80px);
      animation: breathe 5s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 430px;
      animation: appear 1s ease;
    }

    .aura-core {
      width: 150px;
      height: 150px;
      margin: 0 auto 38px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow:
        0 0 25px rgba(160,130,255,0.25),
        inset 0 0 25px rgba(160,130,255,0.10);
      animation: pulse 4s ease-in-out infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .core {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 12px white,
        0 0 35px rgba(170,140,255,0.9),
        0 0 70px rgba(130,100,255,0.55);
      animation: corePulse 3s ease-in-out infinite;
    }

    h1 {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 8px;
      margin-bottom: 14px;
    }

    .tagline {
      color: rgba(255,255,255,0.62);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 38px;
    }

    .primary {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 18px;
      background: white;
      color: #08080c;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .primary:active {
      transform: scale(.97);
    }

    .secondary {
      margin-top: 18px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      cursor: pointer;
    }

    .footer {
      position: absolute;
      bottom: 25px;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      letter-spacing: .4px;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: .65;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @keyframes corePulse {
      0%, 100% {
        transform: scale(.85);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(.9);
        opacity: .6;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="glow"></div>

    <section class="content">

      <div class="aura-core">
        <div class="ring"></div>
        <div class="core"></div>
      </div>

      <h1>AURA</h1>

      <p class="tagline">
        Sua história começa aqui.
        <br>
        Crie. Escolha. Viva.
      </p>

      <button class="primary" onclick="startStory()">
        ✦ Começar uma história
      </button>

      <button class="secondary" onclick="login()">
        Entrar
      </button>

    </section>

    <div class="footer">
      AURA LINE
    </div>

  </main>

  <script>
    function startStory() {
      alert("Em breve: criação da sua história.");
    }

    function login() {
      alert("Login da Aura Line em breve.");
    }
  </script>

</body>
</html>
