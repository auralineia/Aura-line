<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="AURA — intelligence for your story">
<title>AURA — intelligence for your story</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#050505;
  --bg2:#090909;
  --panel:#0c0c0d;
  --panel2:#111113;
  --panel3:#171719;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.13);
  --text:#f7f7f8;
  --muted:#99999f;
  --muted2:#696970;
  --pink:#ff3f9f;
  --pink2:#ff70ba;
  --pink3:#ff9bcd;
  --pinkSoft:rgba(255,63,159,.12);
  --pinkSoft2:rgba(255,63,159,.07);
  --danger:#ff557d;
  --green:#67e6a2;
  --radius:18px;
  --sidebar:318px;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}
button,input,textarea,select{
  font:inherit;
}
button{
  border:0;
  cursor:pointer;
}
.hidden{
  display:none!important;
}
/* =========================
   AURA BRAND MARK
========================= */
.aura-mark{
  position:relative;
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
}
.aura-mark .core{
  width:13px;
  height:13px;
  border-radius:50%;
  background:
    radial-gradient(circle at 40% 35%,#fff 0 12%,#ffd8eb 30%,var(--pink2) 62%,var(--pink) 100%);
  box-shadow:
    0 0 9px rgba(255,112,186,.9),
    0 0 23px rgba(255,63,159,.55);
  position:relative;
  z-index:2;
}
.aura-mark .ring{
  position:absolute;
  inset:5px;
  border:1px solid rgba(255,112,186,.82);
  border-radius:50%;
  transform:rotate(-20deg) scaleX(.82);
  box-shadow:0 0 12px rgba(255,63,159,.25);
}
.aura-mark .ring2{
  position:absolute;
  inset:2px 8px;
  border:1px solid rgba(255,155,205,.35);
  border-radius:50%;
  transform:rotate(42deg);
}
.aura-mark.thinking .core{
  animation:auraPulse 1s infinite ease-in-out;
}
.aura-mark.thinking .ring{
  animation:auraSpin 1.5s infinite linear;
}
@keyframes auraPulse{
  0%,100%{transform:scale(.82);box-shadow:0 0 8px rgba(255,112,186,.6)}
  50%{transform:scale(1.18);box-shadow:0 0 24px rgba(255,63,159,.95)}
}
@keyframes auraSpin{
  from{transform:rotate(-20deg) scaleX(.82)}
  to{transform:rotate(340deg) scaleX(.82)}
}
/* =========================
   AUTH
========================= */
.auth{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,63,159,.09),transparent 34%),
    var(--bg);
}
.auth-box{
  width:min(430px,100%);
  text-align:center;
}
.auth-logo{
  margin:0 auto 28px;
  width:74px;
  height:74px;
}
.auth-logo .core{
  width:27px;
  height:27px;
}
.auth-logo .ring{
  inset:12px;
}
.auth-logo .ring2{
  inset:6px 18px;
}
.auth h1{
  font-size:32px;
  letter-spacing:-1.5px;
  margin:0 0 8px;
  font-weight:700;
}
.tagline{
  color:var(--muted);
  font-size:15px;
  margin-bottom:34px;
}
.auth-card{
  background:rgba(13,13,14,.9);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 80px rgba(0,0,0,.4);
}
.field{
  margin-bottom:12px;
}
.field input,
.field textarea,
.field select{
  width:100%;
  background:#101012;
  color:var(--text);
  border:1px solid var(--line);
  outline:none;
  border-radius:13px;
  padding:14px 15px;
  transition:.2s;
}
.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:rgba(255,63,159,.55);
  box-shadow:0 0 0 3px rgba(255,63,159,.08);
}
.primary-btn{
  width:100%;
  padding:14px 18px;
  border-radius:13px;
  color:#fff;
  font-weight:650;
  background:linear-gradient(135deg,#ff318f,#ff62b2);
  box-shadow:0 8px 25px rgba(255,63,159,.18);
}
.primary-btn:hover{
  filter:brightness(1.08);
}
.secondary-btn{
  padding:12px 16px;
  border-radius:12px;
  background:#151517;
  color:var(--text);
  border:1px solid var(--line);
}
.auth-switch{
  margin-top:17px;
  color:var(--muted);
  font-size:13px;
}
.auth-switch button{
  color:var(--pink2);
  background:none;
  padding:0;
}
/* =========================
   APP
========================= */
.app{
  width:100%;
  height:100%;
  display:flex;
  background:var(--bg);
}
.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}
/* =========================
   TOPBAR — INTENCIONALMENTE LIMPA
========================= */
.topbar{
  height:68px;
  flex:none;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid rgba(255,255,255,.045);
  position:relative;
  z-index:5;
}
.menu-btn{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  background:transparent;
  border-radius:12px;
  color:#fff;
}
.menu-btn:hover{
  background:rgba(255,255,255,.06);
}
.menu-lines{
  width:20px;
  height:16px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.menu-lines span{
  display:block;
  height:1.5px;
  width:100%;
  border-radius:10px;
  background:#fff;
}
.brand{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:9px;
}
.brand-name{
  font-size:15px;
  font-weight:750;
  letter-spacing:2.5px;
}
.credit-pill{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid rgba(255,63,159,.22);
  background:rgba(255,63,159,.055);
  border-radius:999px;
  font-size:12px;
  color:#f6d7e8;
}
.credit-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 8px var(--pink);
}
/* =========================
   CHAT
========================= */
.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:34px 20px 140px;
  scroll-behavior:smooth;
}
.chat-inner{
  width:min(820px,100%);
  margin:0 auto;
}
.welcome{
  min-height:calc(100vh - 210px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
.welcome .aura-mark{
  width:70px;
  height:70px;
  margin-bottom:24px;
}
.welcome .aura-mark .core{
  width:27px;
  height:27px;
}
.welcome .aura-mark .ring{
  inset:11px;
}
.welcome .aura-mark .ring2{
  inset:6px 18px;
}
.welcome h2{
  margin:0;
  font-size:30px;
  letter-spacing:-1.3px;
}
.welcome p{
  color:var(--muted);
  margin:9px 0 0;
  font-size:14px;
}
.messages{
  display:flex;
  flex-direction:column;
  gap:22px;
}
.message{
  display:flex;
  gap:12px;
  line-height:1.65;
  font-size:15px;
}
.message.user{
  justify-content:flex-end;
}
.message.user .bubble{
  max-width:min(680px,85%);
  background:#151517;
  border:1px solid var(--line);
  border-radius:18px 18px 5px 18px;
  padding:12px 15px;
}
.message.aura{
  align-items:flex-start;
}
.message.aura .aura-mark{
  width:28px;
  height:28px;
  margin-top:2px;
}
.message.aura .aura-mark .core{
  width:10px;
  height:10px;
}
.message.aura .aura-mark .ring{
  inset:4px;
}
.message.aura .aura-mark .ring2{
  inset:2px 7px;
}
.message.aura .content{
  max-width:760px;
  color:#ededf0;
}
.message.aura .content p{
  margin:0 0 10px;
}
.message.aura .content p:last-child{
  margin-bottom:0;
}
.typing{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px;
}
.dots{
  display:flex;
  gap:4px;
}
.dots i{
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--pink2);
  animation:dot 1.1s infinite ease-in-out;
}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{
  0%,100%{opacity:.25;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-3px)}
}
/* =========================
   COMPOSER
========================= */
.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 20px 20px;
  background:linear-gradient(to top,var(--bg) 72%,transparent);
  pointer-events:none;
}
.composer{
  width:min(820px,100%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  border:1px solid var(--line2);
  background:rgba(13,13,14,.96);
  border-radius:19px;
  box-shadow:0 15px 50px rgba(0,0,0,.45);
  pointer-events:auto;
}
.composer textarea{
  flex:1;
  min-width:0;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 9px;
  line-height:1.45;
}
.composer textarea::placeholder{
  color:#6f6f75;
}
.send-btn{
  width:40px;
  height:40px;
  border-radius:13px;
  background:var(--pink);
  color:#fff;
  display:grid;
  place-items:center;
  transition:.2s;
}
.send-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(255,63,159,.28);
}
.send-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none;
}
.send-arrow{
  width:14px;
  height:14px;
  border-right:2px solid white;
  border-top:2px solid white;
  transform:rotate(-45deg);
  margin-left:-3px;
}
/* =========================
   SIDEBAR
========================= */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:30;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  backdrop-filter:blur(3px);
}
.overlay.show{
  opacity:1;
  pointer-events:auto;
}
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(var(--sidebar),88vw);
  background:#09090a;
  border-right:1px solid var(--line);
  z-index:40;
  transform:translateX(-102%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;
  flex-direction:column;
  box-shadow:20px 0 70px rgba(0,0,0,.35);
}
.sidebar.open{
  transform:translateX(0);
}
.sidebar-head{
  height:76px;
  flex:none;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid var(--line);
}
.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.sidebar-brand strong{
  letter-spacing:2px;
  font-size:14px;
}
.close-sidebar{
  margin-left:auto;
  width:38px;
  height:38px;
  border-radius:11px;
  background:#121214;
  color:#bbb;
  font-size:21px;
}
.sidebar-body{
  overflow-y:auto;
  padding:16px 12px 22px;
}
.section-label{
  padding:11px 10px 7px;
  color:#65656b;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
.nav-item{
  width:100%;
  min-height:58px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  gap:13px;
  background:transparent;
  color:#d8d8dc;
  border-radius:14px;
  text-align:left;
  margin-bottom:3px;
}
.nav-item:hover{
  background:#111113;
}
.nav-item.active{
  background:rgba(255,63,159,.09);
  color:#fff;
}
.nav-icon{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:11px;
  color:var(--pink2);
  background:rgba(255,63,159,.075);
  border:1px solid rgba(255,63,159,.12);
}
/* AURA ICON SYSTEM */
.nav-icon svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.nav-copy{
  min-width:0;
  flex:1;
}
.nav-title{
  font-size:13px;
  font-weight:600;
}
.nav-sub{
  margin-top:2px;
  color:#68686e;
  font-size:10px;
}
.nav-chevron{
  color:#55555b;
  font-size:17px;
}
.sidebar-profile{
  margin-top:16px;
  padding:14px;
  border-radius:16px;
  background:#0f0f11;
  border:1px solid var(--line);
}
.profile-name{
  font-size:13px;
  font-weight:650;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.profile-email{
  color:#6d6d73;
  font-size:10px;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.plan-mini{
  margin-top:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#ddd;
  font-size:11px;
}
.plan-mini b{
  color:var(--pink2);
}
/* =========================
   MODALS
========================= */
.modal-layer{
  position:fixed;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(7px);
}
.modal{
  width:min(720px,100%);
  max-height:min(88vh,760px);
  overflow:auto;
  background:#0b0b0d;
  border:1px solid var(--line2);
  border-radius:23px;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}
.modal.small{
  width:min(470px,100%);
}
.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  align-items:center;
  padding:18px 20px;
  background:rgba(11,11,13,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.modal-head h3{
  margin:0;
  font-size:16px;
}
.modal-head p{
  margin:4px 0 0;
  color:#737379;
  font-size:11px;
}
.modal-close{
  margin-left:auto;
  width:36px;
  height:36px;
  border-radius:10px;
  color:#aaa;
  background:#151517;
  font-size:18px;
}
.modal-body{
  padding:18px;
}
.setting-row{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 4px;
  border-bottom:1px solid rgba(255,255,255,.055);
}
.setting-row:last-child{
  border-bottom:0;
}
.setting-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:var(--pink2);
  background:rgba(255,63,159,.07);
}
.setting-icon svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.setting-info{
  flex:1;
  min-width:0;
}
.setting-info strong{
  font-size:13px;
  display:block;
}
.setting-info span{
  display:block;
  margin-top:3px;
  color:#707077;
  font-size:11px;
  line-height:1.4;
}
.value{
  color:var(--pink2);
  font-size:11px;
  white-space:nowrap;
}
.modal-actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}
.modal-actions button{
  flex:1;
}
.danger-btn{
  width:100%;
  padding:12px;
  background:rgba(255,85,125,.07);
  color:#ff7898;
  border:1px solid rgba(255,85,125,.15);
  border-radius:12px;
}
/* =========================
   PLANS
========================= */
.plans{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.plan-card{
  position:relative;
  border:1px solid var(--line);
  background:#101012;
  border-radius:17px;
  padding:16px;
}
.plan-card.selected{
  border-color:rgba(255,63,159,.6);
  box-shadow:0 0 0 1px rgba(255,63,159,.15);
}
.plan-card h4{
  margin:0 0 5px;
  font-size:15px;
}
.plan-price{
  color:#fff;
  font-size:18px;
  font-weight:700;
}
.plan-price span{
  color:#66666d;
  font-size:10px;
  font-weight:400;
}
.plan-credit{
  color:var(--pink2);
  font-size:11px;
  margin:8px 0 13px;
}
.plan-features{
  margin:0;
  padding:0;
  list-style:none;
}
.plan-features li{
  color:#8d8d93;
  font-size:10px;
  padding:4px 0;
  line-height:1.35;
}
.plan-features li::before{
  content:"";
  display:inline-block;
  width:4px;
  height:4px;
  background:var(--pink);
  border-radius:50%;
  margin-right:7px;
  vertical-align:middle;
}
.plan-btn{
  width:100%;
  margin-top:13px;
  padding:10px;
  border-radius:10px;
  background:#171719;
  color:#ddd;
  border:1px solid var(--line);
  font-size:11px;
}
.plan-card.selected .plan-btn{
  background:var(--pink);
  color:#fff;
  border-color:transparent;
}
/* =========================
   HISTORY
========================= */
.history-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.history-item{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:#101012;
  border:1px solid var(--line);
  color:#ddd;
  text-align:left;
}
.history-item:hover{
  border-color:rgba(255,63,159,.25);
}
.history-item strong{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.history-item span{
  display:block;
  color:#66666c;
  font-size:10px;
  margin-top:4px;
}
.empty{
  padding:30px 10px;
  text-align:center;
  color:#66666d;
  font-size:12px;
}
/* =========================
   SUPPORT / FAQ
========================= */
.support-card{
  padding:15px;
  background:#101012;
  border:1px solid var(--line);
  border-radius:15px;
  margin-bottom:9px;
}
.support-card strong{
  display:block;
  font-size:13px;
}
.support-card p{
  margin:6px 0 0;
  color:#77777e;
  font-size:11px;
  line-height:1.55;
}
.support-card button{
  margin-top:11px;
  padding:8px 11px;
  border-radius:9px;
  background:rgba(255,63,159,.08);
  color:var(--pink2);
  font-size:10px;
}
/* =========================
   TOAST
========================= */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  z-index:200;
  background:#161618;
  border:1px solid var(--line2);
  color:#eee;
  padding:11px 15px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
/* =========================
   RESPONSIVE
========================= */
@media(max-width:720px){
  :root{
    --sidebar:min(330px,88vw);
  }
  .topbar{
    height:62px;
    padding:0 11px;
  }
  .credit-pill{
    padding:7px 9px;
  }
  .chat{
    padding:25px 14px 125px;
  }
  .welcome h2{
    font-size:26px;
  }
  .composer-wrap{
    padding:12px 10px 12px;
  }
  .plans{
    grid-template-columns:1fr;
  }
  .plan-card{
    padding:15px;
  }
  .modal-layer{

/* =========================================================

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function toast(message){
  toastEl.textContent=message;
  toastEl.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{
    toastEl.classList.remove("show");

}

  return plans[currentPlan]||plans.free;
}

    currentUser.user_metadata?.name||

    "Usuário";

    userLanguage==="pt-BR"

}

    ?.addEventListener("click",e=>{
      if(e.target.id==="modalLayer") closeModal();
    });

    .forEach(btn=>btn.addEventListener("click",closeModal));
}
function formatDate(date){
  try{
    return new Intl.DateTimeFormat(
      userLanguage==="pt-BR"?"pt-BR":
      userLanguage==="es"?"es-ES":"en-US",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    ).format(new Date(date));
  }catch{
    return "";
  }
}
/* =========================================================
   AUTH
========================================================= */
document.getElementById("showSignup").onclick=()=>{
  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");
};
document.getElementById("showLogin").onclick=()=>{
  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
};
document.getElementById("loginBtn").onclick=login;
document.getElementById("signupBtn").onclick=signup;
async function login(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!email||!password){
    toast("Preencha e-mail e senha.");
    return;
  }
  const btn=document.getElementById("loginBtn");
  btn.disabled=true;
  btn.textContent="Entrando...";
  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });
  btn.disabled=false;
  btn.textContent="Entrar";
  if(error){
    toast(error.message||"Não foi possível entrar.");
    return;
  }
  currentUser=data.user;
  await startApp();
}
async function signup(){
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;
  if(!email||!password){
    toast("Preencha e-mail e senha.");
    return;
  }
  if(password.length<6){
    toast("A senha precisa ter pelo menos 6 caracteres.");
    return;
  }
  const btn=document.getElementById("signupBtn");
  btn.disabled=true;
  btn.textContent="Criando...";
  const {data,error}=await supabaseClient.auth.signUp({
    email,
    password
  });
  btn.disabled=false;
  btn.textContent="Criar conta";
  if(error){
    toast(error.message||"Não foi possível criar a conta.");
    return;
  }
  if(data.user){
    toast(
      data.session
        ? "Conta criada."
        : "Conta criada. Verifique seu e-mail se necessário."
    );
  }
}
/* =========================================================
   SESSION
========================================================= */
async function startApp(){
  if(!currentUser) return;
  authScreen.classList.add("hidden");
  app.classList.remove("hidden");
  updateAccountUI();
  await loadCredits();
  await loadStories();
  if(!conversation.length){
    showWelcome();
  }
  input.focus();
}
async function boot(){
  const {data}=await supabaseClient.auth.getSession();
  currentUser=data.session?.user||null;
  if(currentUser){
    await startApp();
  }
}
supabaseClient.auth.onAuthStateChange(async(_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    await startApp();
  }
});
/* =========================================================
   CREDITS
========================================================= */
async function loadCredits(){
  if(!currentUser) return;
  try{
    const {data,error}=await supabaseClient
      .from("credits")
      .select("balance")
      .eq("user_id",currentUser.id)
      .maybeSingle();
    if(error) throw error;
    if(!data){
      const {data:created,error:createError}=await supabaseClient
        .from("credits")
        .insert({
          user_id:currentUser.id,
          balance:20
        })
        .select("balance")
        .single();
      if(createError) throw createError;
      credits=Number(created?.balance??20);
    }else{
      credits=Number(data.balance??0);
    }
    updateCreditsUI();
  }catch(error){
    console.error(error);
    credits=20;
    updateCreditsUI();
  }
}
async function changeCredits(amount){
  if(!currentUser) return false;
  const next=Math.max(0,credits+amount);
  try{
    const {error}=await supabaseClient
      .from("credits")
      .upsert({
        user_id:currentUser.id,
        balance:next
      },{
        onConflict:"user_id"
      });
    if(error) throw error;
    credits=next;
    updateCreditsUI();
    return true;
  }catch(error){
    console.error(error);
    return false;
  }
}
/* =========================================================
   STORIES
========================================================= */
async function loadStories(){
  if(!currentUser) return [];
  const {data,error}=await supabaseClient
    .from("stories")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("updated_at",{ascending:false});
  if(error){
    console.error(error);
    return [];
  }
  return data||[];
}
async function createStory(title="Nova história"){
  const {data,error}=await supabaseClient
    .from("stories")
    .insert({
      user_id:currentUser.id,
      title,
      messages:[]
    })
    .select()
    .single();
  if(error){
    console.error(error);
    toast("Não foi possível criar a história.");
    return null;
  }
  return data;
}
async function saveStory(){
  if(!currentUser||!currentStoryId) return;
  const firstUser=conversation.find(x=>x.role==="user");
  let title="Nova história";
  if(firstUser?.content){
    title=firstUser.content
      .replace(/\s+/g," ")
      .trim()
      .slice(0,55);
    if(!title) title="Nova história";
  }
  const {error}=await supabaseClient
    .from("stories")
    .update({
      title,
      messages:conversation,
      updated_at:new Date().toISOString()
    })
    .eq("id",currentStoryId)
    .eq("user_id",currentUser.id);
  if(error){
    console.error(error);
  }
}
async function deleteStory(id){
  if(!currentUser||!id) return;
  const {error}=await supabaseClient
    .from("stories")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

    toast("Não foi possível apagar.");
    return;
  }
  if(currentStoryId===id){
    currentStoryId=null;
    conversation=[];
    messagesEl.innerHTML="";
    showWelcome();
  }
  toast("História apagada.");
}
/* =========================================================
   CHAT STATE
========================================================= */
function showWelcome(){
  welcomeEl.classList.remove("hidden");
}
function hideWelcome(){
  welcomeEl.classList.add("hidden");
}
function renderText(text){
  const safe=escapeHtml(text);
  return safe
    .split(/\n{2,}/)
    .map(part=>`<p>${part.replace(/\n/g,"<br>")}</p>`)
    .join("");
}
function addMessage(role,text,animate=false){
  hideWelcome();
  const el=document.createElement("div");
  el.className=`message ${role}`;
  if(role==="user"){
    el.innerHTML=`
      <div class="bubble">${renderText(text)}</div>
    `;
  }else{
    el.innerHTML=`
      <div class="aura-mark">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="core"></div>
      </div>
      <div class="content">
        ${renderText(text)}
      </div>
    `;
  }
  messagesEl.appendChild(el);
  scrollChat();
  return el;
}
function addThinking(){
  hideWelcome();
  const el=document.createElement("div");
  el.className="message aura";
  el.id="thinkingMessage";
  el.innerHTML=`
    <div class="aura-mark thinking">
      <div class="ring"></div>
      <div class="ring2"></div>
      <div class="core"></div>
    </div>
    <div class="typing">
      <span>Aura está pensando</span>
      <span class="dots">
        <i></i><i></i><i></i>
      </span>
    </div>
  `;
  messagesEl.appendChild(el);
  scrollChat();
  return el;
}
function scrollChat(){
  requestAnimationFrame(()=>{
    chatEl.scrollTop=chatEl.scrollHeight;
  });
}
function autoResize(){
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,150)+"px";
}
input.addEventListener("input",autoResize);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
  if(e.key==="Escape"){
    closeSidebar();
    closeModal();
  }
});
sendBtn.onclick=sendMessage;
/* =========================================================
   SEND
========================================================= */
async function sendMessage(){
  if(isSending) return;

  const message=input.value.trim();
  if(!message) return;

  if(!currentUser){
    toast("Entre na sua conta primeiro.");
    return;
  }

  if(credits<=0){
    openPlans();
    toast("Seus créditos acabaram.");
    return;
  }

  isSending=true;
  sendBtn.disabled=true;

  input.value="";
  autoResize();

  conversation.push({
    role:"user",
    content:message
  });

  addMessage("user",message);

  if(!currentStoryId){
    const story=await createStory("Nova história");
    if(story){
      currentStoryId=story.id;
    }
  }

  const thinking=addThinking();

  try{
    let {data:sessionData}=await supabaseClient.auth.getSession();
    let session=sessionData?.session;

    if(!session?.access_token){
      const refreshed=await supabaseClient.auth.refreshSession();
      session=refreshed.data?.session;
    }

    if(!session?.access_token){
      throw new Error("Sessão expirada. Entre novamente.");
    }

    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${session.access_token}`
      },
      body:JSON.stringify({
        message,
        history:conversation.slice(0,-1),
        language:userLanguage,
        plan:currentPlan,
        planConfig:{
          name:getPlan().name,
          model:getPlan().model,
          memory:getPlan().memory,
          research:getPlan().research,
          speed:getPlan().speed,
          context:getPlan().context,
          complexity:getPlan().complexity
        }
      })
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok){
      if(response.status===401){
        toast("Sua sessão expirou. Entre novamente.");
        await supabaseClient.auth.signOut();
        return;
      }

      if(response.status===402){
        if(typeof data.credits==="number"){
          credits=data.credits;
          updateCreditsUI();
        }else{
          await loadCredits();
        }

        openPlans();
        toast(data.error||"Seus créditos acabaram.");
        return;
      }

      throw new Error(data.error||"Erro na API.");
    }

    if(typeof data.credits==="number"){
      credits=data.credits;
      updateCreditsUI();
    }else{
      await loadCredits();
    }

    const reply=String(data.reply||"");

    thinking.remove();

    if(!reply){
      throw new Error("A Aura não retornou uma resposta.");
    }

    const auraMessage=addMessage("aura","");
    const content=auraMessage.querySelector(".content");

    conversation.push({
      role:"assistant",
      content:reply
    });

    await progressiveText(content,reply);
    await saveStory();

  }catch(error){
    console.error(error);

    thinking.remove();

    addMessage(
      "aura",
      error.message==="Sessão expirada. Entre novamente."
        ? "Sua sessão expirou. Entre novamente para continuar."
        : "Não consegui responder agora. Tente novamente em alguns instantes."
    );
  }

  isSending=false;
  sendBtn.disabled=false;
  input.focus();
}
  async function progressiveText(element,text){
  const words=text.split(/(\s+)/);
  let result="";
  for(const part of words){
    result+=part;
    element.innerHTML=renderText(result);
    scrollChat();
    await new Promise(resolve=>setTimeout(resolve,8));
  }
}

async function openHistory(){

          <h3>Histórico</h3>

      </div>

        <button class="primary-btn" id="modalNewStory">
          Nova história
        </button>
        <div style="height:14px"></div>
        <div class="history-list">
  `;
  if(!stories.length){
    html+=`
      <div class="empty">
        Você ainda não tem histórias salvas.
      </div>
    `;
  }else{
    stories.forEach(story=>{
      const count=Array.isArray(story.messages)
        ? story.messages.length
        : 0;
      html+=`
        <div class="history-item" data-story-id="${escapeHtml(story.id)}">
          <strong>${escapeHtml(story.title||"Nova história")}</strong>
          <span>
            ${count} mensagens · ${formatDate(story.updated_at)}
          </span>
          <div style="display:flex;gap:7px;margin-top:10px">
            <button
              class="secondary-btn load-story"
              data-id="${escapeHtml(story.id)}"
              style="padding:7px 9px;font-size:10px"
            >
              Abrir
            </button>
            <button
              class="secondary-btn delete-story"
              data-id="${escapeHtml(story.id)}"
              style="padding:7px 9px;font-size:10px;color:#ff7898"
            >
              Apagar
            </button>
          </div>
        </div>
      `;
    });
  }
  html+=`
        </div>
      </div>
    </div>
  `;
  openModal(html);
  document.getElementById("modalNewStory").onclick=()=>{
    closeModal();
    newStory();
  };
  document.querySelectorAll(".load-story").forEach(btn=>{
    btn.onclick=async()=>{
      await loadStory(btn.dataset.id);
      closeModal();
    };
  });
  document.querySelectorAll(".delete-story").forEach(btn=>{
    btn.onclick=async()=>{
      if(confirm("Apagar esta história?")){
        await deleteStory(btn.dataset.id);
        closeModal();
      }
    };
  });
}
async function loadStory(id){
  const {data,error}=await supabaseClient
    .from("stories")
    .select("*")
    .eq("id",id)
    .eq("user_id",currentUser.id)
    .single();
  if(error||!data){
    toast("Não foi possível abrir a história.");
    return;
  }
  currentStoryId=data.id;
  conversation=Array.isArray(data.messages)?data.messages:[];
  messagesEl.innerHTML="";
  hideWelcome();
  conversation.forEach(msg=>{
    if(msg.role==="user"||msg.role==="assistant"){
      addMessage(
        msg.role==="assistant"?"aura":"user",
        msg.content
      );
    }
  });
  scrollChat();
  input.focus();
}

async function changePassword(){
  const password=prompt("Digite sua nova senha:");
  if(!password) return;
  if(password.length<6){
    toast("A senha precisa ter pelo menos 6 caracteres.");
    return;
  }
  const {error}=await supabaseClient.auth.updateUser({
    password
  });
  if(error){
    toast(error.message||"Não foi possível alterar a senha.");
    return;
  }
  toast("Senha alterada.");
}
async function logout(){
  const {error}=await supabaseClient.auth.signOut({
    scope:"global"
  });
  if(error){
    toast("Não foi possível sair.");
    return;
  }
  closeModal();
  currentUser=null;
  currentStoryId=null;
  conversation=[];
  app.classList.add("hidden");
  authScreen.classList.remove("hidden");
  messagesEl.innerHTML="";
  document.getElementById("loginEmail").value="";
  document.getElementById("loginPassword").value="";
}
