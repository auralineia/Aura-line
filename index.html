<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aura</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050507;--bg2:#09090d;--panel:#0d0d12;--panel2:#111117;--white:#fafafa;--text:rgba(255,255,255,.90);--muted:rgba(255,255,255,.45);--faint:rgba(255,255,255,.22);--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);--pink:#ff4fa3;--pink2:#ff83bd;--purple:#9b7cff;--danger:#ff719e}
html,body{width:100%;height:100%;background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;-webkit-tap-highlight-color:transparent}

/* ===== AUTH ===== */
#authScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(circle at 50% 25%,rgba(255,79,163,.13),transparent 30%),radial-gradient(circle at 50% 75%,rgba(155,124,255,.08),transparent 35%),#050507}
.auth-box{width:100%;max-width:390px;text-align:center}
.aura-symbol{position:relative;width:112px;height:112px;margin:0 auto 30px;display:flex;align-items:center;justify-content:center}
.aura-symbol .orbit{position:absolute;inset:4px;border-radius:50%;border:1px solid transparent;background:linear-gradient(#050507,#050507) padding-box,conic-gradient(from 210deg,transparent 0deg,var(--pink) 65deg,#ffb4d9 125deg,var(--purple) 205deg,transparent 285deg,var(--pink) 360deg) border-box;box-shadow:0 0 25px rgba(255,79,163,.14),0 0 65px rgba(155,124,255,.10);animation:spin 8s linear infinite}
.aura-symbol .orbit2{position:absolute;inset:18px;border-radius:50%;border:1px solid rgba(255,255,255,.10);transform:rotate(-28deg)}
.aura-symbol .orb{width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 30px rgba(255,79,163,.75),0 0 60px rgba(155,124,255,.38);animation:pulse 3s ease-in-out infinite}
.auth-title{font-size:34px;font-weight:600;letter-spacing:9px;margin-right:-9px;margin-bottom:10px}
.auth-subtitle{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:28px}
.auth-form{display:flex;flex-direction:column;gap:10px}
.auth-input{width:100%;height:54px;border:1px solid var(--line2);border-radius:16px;outline:none;background:rgba(255,255,255,.035);color:#fff;padding:0 17px;font-size:15px;transition:.2s}
.auth-input:focus{border-color:rgba(255,79,163,.38);box-shadow:0 0 0 4px rgba(255,79,163,.055)}
.auth-input::placeholder{color:rgba(255,255,255,.27)}
.auth-button{height:54px;border-radius:16px;background:#fff;color:#050507;font-weight:650;cursor:pointer;margin-top:4px;transition:.2s}
.auth-button:active{transform:scale(.98)}
.auth-button:disabled{opacity:.45}
.auth-switch{margin-top:20px;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.auth-switch span{color:var(--pink2)}
.auth-msg{min-height:18px;margin-top:12px;color:#ff91b7;font-size:12px;line-height:1.4}
.auth-msg.ok{color:#9fffd2}

/* ===== APP ===== */
#app{display:none}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(255,79,163,.05),transparent 40%),var(--bg)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(to bottom,rgba(5,5,7,.92),rgba(5,5,7,.75) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.icon-btn:active{background:rgba(255,255,255,.06);transform:scale(.94)}
.topbar-center{display:flex;flex-direction:column;align-items:center;gap:1px}
.topbar-name{font-size:15px;font-weight:600;letter-spacing:4px;margin-right:-4px}
.topbar-status{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.7)}
.credits-pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,79,163,.08);border:1px solid rgba(255,79,163,.22);color:var(--pink2);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.credits-pill:active{transform:scale(.95)}

/* ===== CHAT ===== */
.chat-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:78px 16px 120px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.msg{display:flex;width:100%;animation:msgIn .28s cubic-bezier(.2,.9,.3,1)}
.msg.user{justify-content:flex-end}
.bubble{max-width:82%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,rgba(255,79,163,.16),rgba(155,124,255,.13));border:1px solid rgba(255,79,163,.22);border-bottom-right-radius:6px;color:var(--text)}
.msg.aura .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--text)}
.bubble-time{display:block;margin-top:5px;font-size:10px;color:var(--faint);text-align:right}
.typing{display:inline-flex;gap:5px;align-items:center;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--pink2);opacity:.35;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 10px;gap:14px}
.empty .aura-symbol{transform:scale(.75);margin-bottom:6px}
.empty h2{font-size:19px;font-weight:600}
.empty p{color:var(--muted);font-size:13.5px;line-height:1.6;max-width:300px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.suggestion{padding:9px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s}
.suggestion:active{border-color:rgba(255,79,163,.4);color:var(--text);transform:scale(.96)}

/* ===== COMPOSER ===== */
.composer{position:absolute;left:0;right:0;bottom:0;z-index:50;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(5,5,7,.95) 55%,transparent)}
.composer-inner{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:9px}
.input-wrap{flex:1;display:flex;align-items:flex-end;background:var(--panel2);border:1px solid var(--line2);border-radius:24px;padding:6px 6px 6px 17px;transition:.2s}
.input-wrap:focus-within{border-color:rgba(255,79,163,.35);box-shadow:0 0 0 4px rgba(255,79,163,.05)}
#input{flex:1;background:none;border:0;outline:none;color:#fff;font-size:15px;line-height:1.45;max-height:130px;resize:none;padding:8px 0}
#input::placeholder{color:rgba(255,255,255,.27)}
.send-btn{width:42px;height:42px;min-width:42px;border-radius:50%;background:#fff;color:#050507;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.35}

/* ===== DRAWER ===== */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:100;width:min(310px,84vw);background:var(--bg2);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .3s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.drawer-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(255,79,163,.25),rgba(155,124,255,.22));border:1px solid rgba(255,79,163,.3);font-weight:700;font-size:16px;color:#fff}
.drawer-user{flex:1;min-width:0}
.drawer-user b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-user span{font-size:11.5px;color:var(--muted)}
.drawer-nav{flex:1;overflow-y:auto;padding:12px}
.nav-item{width:100%;display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:14px;background:none;color:var(--text);font-size:14.5px;cursor:pointer;text-align:left;transition:.15s}
.nav-item:active{background:rgba(255,255,255,.05)}
.nav-item svg{color:var(--muted);flex-shrink:0}
.nav-item.danger{color:var(--danger)}
.nav-item.danger svg{color:var(--danger)}
.nav-sep{height:1px;background:var(--line);margin:8px 4px}
.drawer-foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:11px;color:var(--faint);text-align:center;letter-spacing:2px}

/* ===== MODAL ===== */
.modal-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s}
.modal-wrap.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:480px;max-height:86vh;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(40px);transition:transform .3s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;overflow:hidden}
.modal-wrap.open .modal{transform:translateY(0)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16.5px;font-weight:650}
.modal-body{padding:18px 20px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;font-size:14px;color:var(--text);line-height:1.6}
.modal-body p{color:var(--muted);margin-bottom:14px;font-size:13.5px}
.plan{border:1px solid var(--line2);border-radius:18px;padding:17px;margin-bottom:11px;cursor:pointer;transition:.15s;position:relative}
.plan:active{transform:scale(.98)}
.plan.featured{border-color:rgba(255,79,163,.45);background:linear-gradient(135deg,rgba(255,79,163,.07),rgba(155,124,255,.05))}
.plan-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.plan-name{font-weight:650;font-size:15px}
.plan-price{font-weight:700;font-size:15px;color:var(--pink2)}
.plan-desc{font-size:12.5px;color:var(--muted);line-height:1.5}
.plan-badge{position:absolute;top:-9px;right:14px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;font-size:9.5px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:999px}
.primary-btn{width:100%;height:50px;border-radius:15px;background:#fff;color:#050507;font-weight:650;cursor:pointer;margin-top:6px;transition:.15s}
.primary-btn:active{transform:scale(.98)}
.ghost-btn{width:100%;height:46px;border-radius:15px;background:none;border:1px solid var(--line2);color:var(--muted);cursor:pointer;margin-top:9px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);z-index:500;background:#16161d;border:1px solid var(--line2);color:var(--text);padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:700px){.modal-wrap{align-items:center}.modal{border-radius:24px;border-bottom:1px solid var(--line2)}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-box">
    <div class="aura-symbol"><div class="orbit"></div><div class="orbit2"></div><div class="orb"></div></div>
    <div class="auth-title">AURA</div>
    <p class="auth-subtitle">Sua companheira de IA.<br>Entre para continuar.</p>
    <div class="auth-form">
      <input class="auth-input" id="authName" placeholder="Nome (só no cadastro)" style="display:none">
      <input class="auth-input" id="authEmail" type="email" placeholder="E-mail" autocomplete="email">
      <input class="auth-input" id="authPass" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="auth-button" id="authBtn" onclick="doAuth()">Entrar</button>
    </div>
    <button class="auth-switch" id="authSwitch" onclick="toggleAuthMode()">Não tem conta? <span>Criar conta</span></button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="app">
  <header class="topbar">
    <button class="icon-btn" onclick="toggleDrawer(true)">☰</button>
    <div class="topbar-center">
      <div class="topbar-name">AURA</div>
      <div class="topbar-status"><span class="status-dot"></span><span id="statusText">online</span></div>
    </div>
    <button class="credits-pill" onclick="openModal('credits')">✦ <span id="creditsCount">0</span></button>
  </header>

  <main class="chat-scroll" id="chatScroll">
    <div class="chat-inner" id="chatInner"></div>
  </main>

  <div class="composer">
    <div class="composer-inner">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Mensagem..." oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-avatar" id="drawerAvatar">A</div>
    <div class="drawer-user"><b id="drawerName">Usuário</b><span id="drawerEmail">—</span></div>
  </div>
  <nav class="drawer-nav">
    <button class="nav-item" onclick="openModal('credits')">✦ Créditos</button>
    <button class="nav-item" onclick="openModal('memory')">🧠 Memória da Aura</button>
    <button class="nav-item" onclick="clearChat()">🗑 Limpar conversa</button>
    <div class="nav-sep"></div>
    <button class="nav-item danger" onclick="logout()">⎋ Sair</button>
  </nav>
  <div class="drawer-foot">AURA v1.0</div>
</aside>

<!-- MODAL -->
<div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">—</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== CONFIG — AURA ===== */
const SUPABASE_URL = "https://vqmfsshmjdfjlnmbemxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_nCCjJPHoTODWLHvwTWN_AA_J8JivYaE";
const AURA_API_URL = "https://aura-line-s.vercel.app/api/chat";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);

let user = null, credits = 0, sending = false, isSignup = false;

/* ===== HELPERS ===== */
const $ = id => document.getElementById(id);

function toast(msg){
  const t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove("show"),2600);
}

function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function now(){
  return new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}

/* ===== AUTH ===== */
function toggleAuthMode(){
  isSignup = !isSignup;

  $("authName").style.display = isSignup ? "block" : "none";
  $("authBtn").textContent = isSignup ? "Criar conta" : "Entrar";

  $("authSwitch").innerHTML = isSignup
    ? 'Já tem conta? <span>Entrar</span>'
    : 'Não tem conta? <span>Criar conta</span>';

  $("authMsg").textContent = "";
}

async function doAuth(){
  const email=$("authEmail").value.trim();
  const pass=$("authPass").value;
  const name=$("authName").value.trim();

  const msg=$("authMsg");
  msg.className="auth-msg";
  msg.textContent="";

  if(!email||!pass){
    msg.textContent="Preenche e-mail e senha.";
    return;
  }

  if(isSignup&&!name){
    msg.textContent="Falta teu nome.";
    return;
  }

  $("authBtn").disabled=true;

  try{
    if(isSignup){
      const {error} = await sb.auth.signUp({
        email,
        password:pass,
        options:{
          data:{name}
        }
      });

      if(error) throw error;

      msg.classList.add("ok");
      msg.textContent="Conta criada! Confere teu e-mail e entra.";
    }else{
      const {error} = await sb.auth.signInWithPassword({
        email,
        password:pass
      });

      if(error) throw error;
    }
  }catch(e){
    msg.textContent = e.message || "Erro ao autenticar.";
  }

  $("authBtn").disabled=false;
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

sb.auth.onAuthStateChange(async (_e,session)=>{
  if(session?.user){
    user=session.user;
    await bootApp();
  }
});

/* ===== BOOT ===== */
async function bootApp(){
  $("authScreen").style.display="none";
  $("app").style.display="block";

  const name = user.user_metadata?.name || user.email.split("@")[0];

  $("drawerName").textContent=name;
  $("drawerEmail").textContent=user.email;
  $("drawerAvatar").textContent=name[0].toUpperCase();

  await loadCredits();
  loadHistory();
}

/* ===== CRÉDITOS ===== */
async function loadCredits(){
  const {data,error} = await sb
    .from("credits")
    .select("balance")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error){
    console.error("Erro ao carregar créditos:",error);
    credits=0;
  }else{
    credits=data?.balance ?? 0;
  }

  $("creditsCount").textContent=credits;
}

/* ===== CHAT ===== */
function loadHistory(){
  const inner=$("chatInner");

  const saved=JSON.parse(
    localStorage.getItem("aura_chat_"+user.id)||"[]"
  );

  if(!saved.length){
    renderEmpty();
    return;
  }

  saved.forEach(m=>addBubble(m.role,m.text,m.time,false));
  scrollBottom();
}

function saveMsg(role,text){
  const key="aura_chat_"+user.id;

  const arr=JSON.parse(
    localStorage.getItem(key)||"[]"
  );

  arr.push({
    role,
    text,
    time:now()
  });

  localStorage.setItem(
    key,
    JSON.stringify(arr.slice(-100))
  );
}

function renderEmpty(){
  $("chatInner").innerHTML=`
    <div class="empty">
      <div class="aura-symbol">
        <div class="orbit"></div>
        <div class="orbit2"></div>
        <div class="orb"></div>
      </div>

      <h2>Oi, eu sou a Aura ✦</h2>

      <p>
        Tô aqui pra conversar sobre o que você quiser.
        Por onde começamos?
      </p>

      <div class="suggestions">
        <button class="suggestion" onclick="quickSend(this)">
          Como foi teu dia?
        </button>

        <button class="suggestion" onclick="quickSend(this)">
          Me conta algo curioso
        </button>

        <button class="suggestion" onclick="quickSend(this)">
          Preciso desabafar
        </button>
      </div>
    </div>`;
}

function quickSend(btn){
  $("input").value=btn.textContent;
  sendMessage();
}

function addBubble(role,text,time,save=true){
  const empty=$("chatInner").querySelector(".empty");

  if(empty) empty.remove();

  const div=document.createElement("div");

  div.className="msg "+(
    role==="user"
      ? "user"
      : "aura"
  );

  div.innerHTML=`
    <div class="bubble">
      ${esc(text)}
      <span class="bubble-time">
        ${time||now()}
      </span>
    </div>`;

  $("chatInner").appendChild(div);

  if(save) saveMsg(role,text);

  scrollBottom();
}

function showTyping(){
  const div=document.createElement("div");

  div.className="msg aura";
  div.id="typingMsg";

  div.innerHTML=`
    <div class="bubble">
      <span class="typing">
        <i></i>
        <i></i>
        <i></i>
      </span>
    </div>`;

  $("chatInner").appendChild(div);

  scrollBottom();
}

function hideTyping(){
  $("typingMsg")?.remove();
}

function scrollBottom(){
  const s=$("chatScroll");

  requestAnimationFrame(()=>{
    s.scrollTop=s.scrollHeight;
  });
}

function clearChat(){
  localStorage.removeItem("aura_chat_"+user.id);

  $("chatInner").innerHTML="";

  renderEmpty();

  toggleDrawer(false);

  toast("Conversa limpa.");
}

/* ===== CHAT — API REAL DA AURA ===== */
async function sendMessage(){
  const input=$("input");
  const text=input.value.trim();

  if(!text || sending) return;

  if(credits<=0){
    openModal("credits");
    toast("Sem créditos — aguarde a renovação.");
    return;
  }

  sending=true;
  $("sendBtn").disabled=true;

  input.value="";
  autoGrow(input);

  addBubble("user",text);
  showTyping();

  try{
    const result=await askAura(text);

    hideTyping();

    addBubble("aura",result.reply);

    /*
      O backend da Aura já consumiu o crédito
      através do RPC seguro.

      Se a API retornar a quantidade atual,
      usamos diretamente.
    */
    if(typeof result.credits==="number"){
      credits=result.credits;
      $("creditsCount").textContent=credits;
    }else{
      await loadCredits();
    }

    await saveMemory(text);

  }catch(e){
    hideTyping();

    console.error("Erro ao falar com a Aura:",e);

    addBubble(
      "aura",
      e.message || "Tive um tropeço aqui... tenta de novo? 💭"
    );

    /*
      Se a chamada falhou, não alteramos
      créditos pelo navegador.
    */
    await loadCredits();
  }

  sending=false;
  $("sendBtn").disabled=false;
  input.focus();
}

/* ===== IA — API REAL ===== */
async function askAura(text){
  const refreshed=await sb.auth.refreshSession();

  let session=refreshed.data?.session;

  if(!session){
    const current=await sb.auth.getSession();
    session=current.data?.session;
  }

  if(!session?.access_token){
    throw new Error("Sua sessão expirou. Entre novamente.");
  }

  const response=await fetch(AURA_API_URL,{
    method:"POST",

    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${session.access_token}`
    },

    body:JSON.stringify({
      message:text,
      history:[],
      language:"pt-BR"
    })
  });

  const data=await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(
      data.error ||
      data.details ||
      `Erro da Aura (${response.status}).`
    );
  }

  if(!data.reply){
    throw new Error("A Aura não retornou uma resposta.");
  }

  return data;
}

/* ===== MEMÓRIA ===== */
async function saveMemory(text){
  try{
    await sb
      .from("memories")
      .insert({
        user_id:user.id,
        content:text
      });
  }catch(e){
    console.error("Erro ao salvar memória:",e);
  }
}

async function loadMemory(){
  const {data,error} = await sb
    .from("memories")
    .select("content,created_at")
    .eq("user_id",user.id)
    .order("created_at",{ascending:false})
    .limit(30);

  if(error){
    console.error("Erro ao carregar memória:",error);
    return [];
  }

  return data||[];
}

/* ===== DRAWER / MODAL ===== */
function toggleDrawer(open){
  $("drawer").classList.toggle("open",open);
  $("overlay").classList.toggle("open",open);
}

async function openModal(type){
  toggleDrawer(false);

  const body=$("modalBody");

  if(type==="credits"){
    $("modalTitle").textContent="Créditos";

    body.innerHTML=`
      <p>
        Você tem
        <b style="color:var(--pink2)">
          ${credits} créditos
        </b>.
      </p>

      <div class="plan">
        <div class="plan-top">
          <span class="plan-name">FREE</span>
          <span class="plan-price">Grátis</span>
        </div>

        <div class="plan-desc">
          5 créditos por dia.
        </div>
      </div>

      <div class="plan featured">
        <div class="plan-badge">PRO</div>

        <div class="plan-top">
          <span class="plan-name">PRO</span>
          <span class="plan-price">R$ 9,99/mês</span>
        </div>

        <div class="plan-desc">
          30 créditos por dia.
        </div>
      </div>

      <div class="plan">
        <div class="plan-top">
          <span class="plan-name">ULTRA</span>
          <span class="plan-price">R$ 24,99/mês</span>
        </div>

        <div class="plan-desc">
          100 créditos por dia.
        </div>
      </div>

      <p style="margin-top:12px">
        Os pagamentos serão adicionados posteriormente.
      </p>
    `;

  }else if(type==="memory"){

    $("modalTitle").textContent="Memória da Aura";

    body.innerHTML="<p>Carregando...</p>";

    const mems=await loadMemory();

    body.innerHTML = mems.length

      ? "<p>Coisas que a Aura lembra de você:</p>"+
        mems.map(m=>`
          <div class="plan" style="cursor:default">
            <div class="plan-desc" style="color:var(--text)">
              ${esc(m.content)}
            </div>
          </div>
        `).join("")

      : "<p>Ainda sem memórias. Conversa com ela que ela começa a lembrar de você.</p>";
  }

  $("modalWrap").classList.add("open");
}

function closeModal(){
  $("modalWrap").classList.remove("open");
}

/* ===== INPUT ===== */
function autoGrow(el){
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,130)+"px";
}

function onKey(e){
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

/* ===== INIT ===== */
(async()=>{
  const {
    data:{session}
  }=await sb.auth.getSession();

  if(session?.user){
    user=session.user;
    await bootApp();
  }
})();
</script>
