<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Line — Sua história começa aqui</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #24113f 0%, #09070f 45%, #050509 100%);
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .logo span {
      color: #c084fc;
    }

    .status {
      font-size: 12px;
      color: #a7f3d0;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 22px;
    }

    .tag {
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 78px);
      line-height: .95;
      margin-bottom: 22px;
    }

    .subtitle {
      color: #b8b3c4;
      font-size: 18px;
      line-height: 1.6;
      max-width: 650px;
      margin-bottom: 35px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      max-width: 700px;
    }

    textarea {
      flex: 1;
      min-height: 70px;
      resize: none;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: white;
      border-radius: 18px;
      padding: 18px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #c084fc;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 16px;
      padding: 0 25px;
      font-weight: 700;
      font-size: 15px;
      color: white;
      background: linear-gradient(135deg,#8b5cf6,#c026d3);
      box-shadow: 0 10px 30px rgba(139,92,246,.25);
    }

    button:active {
      transform: scale(.97);
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .example {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: #d6d0df;
      cursor: pointer;
      font-size: 13px;
    }

    .chat {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      font-weight: 700;
    }

    .new-story {
      padding: 10px 14px;
      font-size: 12px;
      background: rgba(255,255,255,.08);
      box-shadow: none;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 20px 120px;
    }

    .message {
      max-width: 780px;
      margin: 0 auto 20px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 16px 18px;
      border-radius: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .assistant .bubble {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.06);
    }

    .user .bubble {
      background: linear-gradient(135deg,#7c3aed,#a21caf);
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: linear-gradient(transparent,#07060b 35%);
    }

    .composer-inner {
      max-width: 860px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .composer textarea {
      min-height: 58px;
      max-height: 140px;
    }

    .send {
      width: 65px;
      padding: 0;
    }

    .typing {
      opacity: .6;
      font-style: italic;
    }

    @media (max-width: 600px) {

      .input-area {
        flex-direction: column;
      }

      .input-area button {
        height: 55px;
      }

      .bubble {
        max-width: 90%;
      }

      .composer-inner {
        gap: 7px;
      }

      .send {
        width: 55px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TELA INICIAL -->

  <section id="welcome" class="welcome">

    <div class="tag">
      AURA LINE AI
    </div>

    <h1>
      Sua história.<br>
      Seu mundo.
    </h1>

    <p class="subtitle">
      Crie uma vida, uma carreira, um romance ou qualquer universo que você imaginar.
      Converse com a Aura e veja sua história evoluir a cada escolha.
    </p>

    <div class="input-area">

      <textarea
        id="storyInput"
        placeholder="Conte como sua história começa..."
      ></textarea>

      <button onclick="startStory()">
        Começar
      </button>

    </div>

    <div class="examples">

      <div
        class="example"
        onclick="setExample('Quero começar uma carreira como piloto de Fórmula 1.')"
      >
        🏎️ Fórmula 1
      </div>

      <div
        class="example"
        onclick="setExample('Quero começar uma carreira como DJ e produtor musical.')"
      >
        🎧 Música
      </div>

      <div
        class="example"
        onclick="setExample('Quero criar uma história de romance.')"
      >
        ❤️ Romance
      </div>

      <div
        class="example"
        onclick="setExample('Quero criar uma história onde me torno um grande empresário.')"
      >
        💼 Negócios
      </div>

      <div
        class="example"
        onclick="setExample('Quero viver uma aventura completamente fictícia.')"
      >
        🌎 Aventura
      </div>

    </div>

  </section>


  <!-- CHAT -->

  <section id="chat" class="chat">

    <div class="chat-header">

      <div>

        <div class="logo">
          AURA<span>LINE</span>
        </div>

        <div class="status">
          ● História ativa
        </div>

      </div>

      <button
        class="new-story"
        onclick="newStory()"
      >
        Nova história
      </button>

    </div>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="composer">

      <div class="composer-inner">

        <textarea
          id="messageInput"
          placeholder="O que você faz agora?"
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="send"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    </div>

  </section>

</div>


<script>

let conversation = [];


function setExample(text) {

  document.getElementById("storyInput").value = text;

}


function startStory() {

  const input =
    document.getElementById("storyInput").value.trim();

  if (!input) {

    alert("Conte primeiro como sua história começa.");

    return;

  }

  document.getElementById("welcome").style.display = "none";

  document.getElementById("chat").style.display = "flex";

  conversation = [];

  addMessage("user", input);

  sendToAI(input);

}


function addMessage(role, text) {

  const messages =
    document.getElementById("messages");

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;

}


async function sendToAI(message) {

  addMessage(
    "assistant",
    "✨ Sua história está sendo preparada..."
  );

  try {

    const response = await fetch(
      "/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: message,

          history: conversation

        })
      }
    );


    const data =
      await response.json();


    const messages =
      document.getElementById("messages");


    messages.lastElementChild.remove();


    if (!response.ok) {

      throw new Error(
        data.error || "Erro na IA."
      );

    }


    addMessage(
      "assistant",
      data.reply
    );


    conversation.push({

      role: "user",

      content: message

    });


    conversation.push({

      role: "assistant",

      content: data.reply

    });


  } catch (error) {

    const messages =
      document.getElementById("messages");


    messages.lastElementChild.remove();


    addMessage(
      "assistant",
      "Não consegui continuar sua história agora. Verifique a configuração da IA e tente novamente."
    );


    console.error(error);

  }

}


async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();


  if (!message) return;


  input.value = "";


  addMessage(
    "user",
    message
  );


  await sendToAI(message);

}


function handleKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


function newStory() {

  conversation = [];

  document.getElementById(
    "messages"
  ).innerHTML = "";

  document.getElementById(
    "chat"
  ).style.display = "none";

  document.getElementById(
    "welcome"
  ).style.display = "flex";

}

</script>

</body>
</html>
