<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <title>Aura Line</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background: #050507;
      color: #f8f5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }
    body {
      overflow: hidden;
    }
    button,
    input,
    textarea {
      font: inherit;
    }
    button {
      -webkit-tap-highlight-color: transparent;
    }
    /* =====================================================
       AUTH
    ===================================================== */
    #authScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(255, 78, 166, 0.09),
          transparent 32%
        ),
        #050507;
    }
    .auth-box {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
    .auth-core {
      width: 124px;
      height: 124px;
      margin: 0 auto 34px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 105, 184, .68);
      box-shadow:
        0 0 18px rgba(255, 68, 157, .15),
        0 0 48px rgba(255, 68, 157, .07),
        inset 0 0 28px rgba(255, 68, 157, .04);
      animation:
        auraPulse 6s ease-in-out infinite,
        pinkGlow 7s ease-in-out infinite;
    }
    .auth-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.10);
    }
    .auth-ring::after {
      content: "";
      position: absolute;
      inset: 21px;
      border-radius: 50%;
      border: 1px solid rgba(255, 130, 195, .14);
    }
    .auth-core-dot {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #fff,
          #ffd7e9 24%,
          #ff91c5 54%,
          #ff5da9 100%
        );
      box-shadow:
        0 0 12px rgba(255, 205, 228, .9),
        0 0 30px rgba(255, 91, 169, .42),
        0 0 60px rgba(255, 60, 153, .16);
      animation: corePulse 5s ease-in-out infinite;
    }
    .auth-title {
      font-size: 35px;
      font-weight: 500;
      letter-spacing: 9px;
      margin-left: 9px;
      margin-bottom: 12px;
    }
    .auth-subtitle {
      color: rgba(255,255,255,.46);
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .auth-input {
      width: 100%;
      height: 52px;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      color: white;
      outline: none;
      padding: 0 16px;
      font-size: 15px;
      backdrop-filter: blur(18px);
      transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }
    .auth-input:focus {
      border-color: rgba(255, 108, 183, .45);
      background: rgba(255,255,255,.055);
      box-shadow:
        0 0 24px rgba(255, 68, 157, .07);
    }
    .auth-input::placeholder {
      color: rgba(255,255,255,.27);
    }
    .auth-button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 16px;
      background: #ff9dca;
      color: #080609;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
      box-shadow:
        0 10px 30px rgba(255, 68, 157, .11);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
    }
    .auth-button:active {
      transform: scale(.985);
    }
    .auth-button:disabled {
      opacity: .45;
    }
    .auth-switch {
      margin-top: 20px;
      border: none;
      background: none;
      color: rgba(255,255,255,.48);
      font-size: 13px;
      cursor: pointer;
    }
    .auth-switch span {
      color: #ff9dca;
    }
    .auth-error {
      min-height: 18px;
      margin-top: 12px;
      color: #ff9ebc;
      font-size: 12px;
      line-height: 1.4;
    }
    .auth-success {
      color: #ffb5d6;
    }
    /* =====================================================
       APP
    ===================================================== */
    .app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% -12%,
          rgba(255, 68, 157, .065),
          transparent 38%
        ),
        #050507;
    }
    /* =====================================================
       TOPBAR
    ===================================================== */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 82px;
      z-index: 20;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding:
        max(12px, env(safe-area-inset-top))
        14px
        12px;
      background:
        linear-gradient(
          to bottom,
          rgba(5,5,7,.98),
          rgba(5,5,7,.78),
          transparent
        );
      backdrop-filter: blur(15px);
    }
    .top-action {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      color: rgba(255,255,255,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }
    .top-action:active {
      transform: scale(.92);
    }
    .top-action:hover {
      background: rgba(255,255,255,.055);
      border-color: rgba(255, 105, 184, .14);
    }
    .hamburger {
      width: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hamburger span {
      display: block;
      height: 1.5px;
      width: 100%;
      background: rgba(255,255,255,.72);
      border-radius: 10px;
    }
    .hamburger span:nth-child(2) {
      width: 72%;
    }
    .plus-icon {
      font-size: 24px;
      font-weight: 300;
      line-height: 1;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .mini-core {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 105, 184, .68);
      box-shadow:
        0 0 11px rgba(255, 68, 157, .15),
        inset 0 0 10px rgba(255, 68, 157, .04);
      animation:
        miniPulse 5s ease-in-out infinite,
        pinkGlow 7s ease-in-out infinite;
    }
    .mini-ring::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.10);
    }
    .mini-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #fff,
          #ffb7d6 45%,
          #ff6caf
        );
      box-shadow:
        0 0 8px rgba(255,188,217,.75),
        0 0 18px rgba(255,68,157,.35);
    }
    .brand-name {
      font-size: 12px;
      letter-spacing: 4px;
      font-weight: 500;
    }
    /* =====================================================
       SIDE MENU
    ===================================================== */
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }
    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(330px, 88vw);
      z-index: 110;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(255, 68, 157, .065),
          transparent 30%
        ),
        rgba(7,7,9,.985);
      border-right: 1px solid rgba(255,255,255,.065);
      transform: translateX(-105%);
      transition:
        transform .36s cubic-bezier(.22,.8,.25,1);
      box-shadow:
        20px 0 70px rgba(0,0,0,.5);
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(16px, env(safe-area-inset-bottom));
    }
    .side-menu.open {
      transform: translateX(0);
    }
    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 22px;
    }
    .menu-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-logo .mini-core {
      width: 27px;
      height: 27px;
    }
    .menu-logo-text {
      font-size: 12px;
      letter-spacing: 4px;
    }
    .close-menu {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.045);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      color: rgba(255,255,255,.62);
      font-size: 22px;
      cursor: pointer;
    }
    .new-story-menu {
      width: 100%;
      height: 52px;
      border-radius: 15px;
      border: 1px solid rgba(255, 105, 184, .12);
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.055),
          rgba(255,68,157,.055)
        );
      color: rgba(255,255,255,.91);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      cursor: pointer;
      margin-bottom: 22px;
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }
    .new-story-menu:active {
      transform: scale(.97);
    }
    .new-story-menu:hover {
      border-color: rgba(255,105,184,.20);
      background: rgba(255,68,157,.06);
    }
    .new-story-icon {
      font-size: 21px;
      font-weight: 300;
      color: #ff9dca;
    }
    .new-story-text {
      font-size: 14px;
      font-weight: 500;
    }
    .history-title {
      padding: 4px 8px 11px;
      font-size: 9px;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: rgba(255,255,255,.27);
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 10px;
      -webkit-overflow-scrolling: touch;
    }
    .history-list::-webkit-scrollbar {
      width: 3px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.08);
      border-radius: 10px;
    }
    .history-empty {
      padding: 30px 12px;
      color: rgba(255,255,255,.28);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }
    .history-item {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 57px;
      padding: 9px 9px 9px 10px;
      margin-bottom: 4px;
      border-radius: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: white;
      cursor: pointer;
      text-align: left;
      transition:
        background .2s ease,
        border .2s ease;
    }
    .history-item:hover,
    .history-item.active {
      background: rgba(255,255,255,.045);
      border-color:
        rgba(255,105,184,.10);
    }
    .history-aura {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      position: relative;
      margin-right: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .history-aura-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,105,184,.55);
      box-shadow:
        0 0 9px rgba(255,68,157,.10);
      animation:
        pinkGlow 7s ease-in-out infinite;
    }
    .history-aura-ring::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
    }
    .history-aura-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff9dca;
      box-shadow:
        0 0 8px rgba(255,157,202,.72);
    }
    .history-info {
      min-width: 0;
      flex: 1;
    }
    .history-name {
      font-size: 13px;
      color: rgba(255,255,255,.86);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .history-date {
      font-size: 10px;
      color: rgba(255,255,255,.25);
    }
    .delete-history {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: rgba(255,255,255,.22);
      cursor: pointer;
      font-size: 15px;
      opacity: 0;
      transition: opacity .18s ease;
    }
    .history-item:hover .delete-history,
    .history-item.active .delete-history {
      opacity: 1;
    }
    .account-area {
      border-top: 1px solid rgba(255,255,255,.055);
      padding-top: 14px;
      margin-top: 8px;
    }
    .account-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border-radius: 13px;
      background: rgba(255,255,255,.03);
      margin-bottom: 7px;
    }
    .account-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.10),
          rgba(255,68,157,.13)
        );
      color: white;
      font-size: 14px;
    }
    .account-info {
      min-width: 0;
      flex: 1;
    }
    .account-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,.25);
      margin-bottom: 3px;
    }
    .account-email {
      font-size: 11px;
      color: rgba(255,255,255,.63);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-credits {
      margin-top: 6px;
      font-size: 11px;
      color: #ff9dca;
      letter-spacing: .2px;
      font-weight: 500;
    }
    .logout-button {
      width: 100%;
      height: 43px;
      border: none;
      border-radius: 13px;
      background: transparent;
      color: rgba(255,150,192,.65);
      text-align: left;
      padding: 0 11px;
      cursor: pointer;
      font-size: 12px;
    }
    .logout-button:active {
      background: rgba(255,68,157,.07);
    }
    /* =====================================================
       CHAT
    ===================================================== */
    .chat {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 105px 18px 120px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .chat::-webkit-scrollbar {
      width: 4px;
    }
    .chat::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.09);
      border-radius: 10px;
    }
    /* =====================================================
       WELCOME
    ===================================================== */
    .welcome {
      min-height: calc(100vh - 220px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 0;
    }
    .aura-core {
      width: 154px;
      height: 154px;
      margin-bottom: 38px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,105,184,.68);
      box-shadow:
        0 0 18px rgba(255,68,157,.15),
        0 0 44px rgba(255,68,157,.07),
        inset 0 0 32px rgba(255,68,157,.035);
      animation:
        auraPulse 6s ease-in-out infinite,
        pinkGlow 7s ease-in-out infinite;
    }
    .ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        inset 0 0 22px rgba(255,255,255,.025);
    }
    .ring::after {
      content: "";
      position: absolute;
      inset: -13px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          transparent 43%,
          rgba(255,68,157,.12) 57%,
          transparent 73%
        );
      filter: blur(11px);
      opacity: .58;
      z-index: -1;
      animation:
        coreHalo 6s ease-in-out infinite;
    }
    .core {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #ffe9f2 20%,
          #ffc0db 43%,
          #ff8abb 67%,
          #ff5da7 100%
        );
      box-shadow:
        0 0 12px rgba(255,236,245,.95),
        0 0 28px rgba(255,147,194,.60),
        0 0 54px rgba(255,68,157,.25),
        0 0 90px rgba(255,68,157,.09);
      animation: corePulse 5s ease-in-out infinite;
    }
    h1 {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 9px;
      margin-left: 9px;
      margin-bottom: 16px;
    }
    .tagline {
      color: rgba(255,255,255,.48);
      font-size: 13px;
      letter-spacing: .4px;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    /* =====================================================
       MESSAGES
    ===================================================== */
    .message {
      display: flex;
      margin-bottom: 25px;
      animation:
        messageAppear .4s ease;
    }
    .message.user {
      justify-content: flex-end;
    }
    .message.aura {
      justify-content: flex-start;
    }
    .message-content {
      max-width: 82%;
    }
    .bubble {
      position: relative;
      padding: 13px 15px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.72;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .bubble {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.065);
      border-bottom-right-radius: 5px;
      color: rgba(255,255,255,.88);
    }
    .message.aura .bubble {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          rgba(255,68,157,.018)
        );
      border: 1px solid rgba(255,255,255,.055);
      border-bottom-left-radius: 5px;
      color: rgba(255,255,255,.86);
    }
    .aura-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(255,157,202,.58);
      margin-bottom: 8px;
      padding-left: 3px;
    }
    .stream-word {
      display: inline;
      opacity: 0;
      filter: blur(5px);
      animation:
        wordReveal .20s ease forwards;
    }
    .mist {
      position: absolute;
      width: 115px;
      height: 60px;
      left: 0;
      top: 50%;
      transform:
        translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse,
          rgba(255,153,202,.32),
          rgba(255,68,157,.11) 40%,
          transparent 72%
        );
      filter: blur(22px);
      opacity: 0;
      mix-blend-mode: screen;
      transition:
        left .12s linear,
        opacity .25s ease;
    }
    .streaming .mist {
      opacity: .55;
      animation:
        mistRotate 3.5s linear infinite,
        mistPulse 1.7s ease-in-out infinite;
    }
    .finished .mist {
      opacity: 0;
    }
    /* =====================================================
       THINKING
    ===================================================== */
    .thinking {
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,.35);
      font-size: 12px;
      margin: 12px 0 22px 4px;
    }
    .thinking-core {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1px solid rgba(255,105,184,.65);
      background:
        radial-gradient(
          circle,
          #fff 0%,
          #ffb9d8 22%,
          #ff72b0 42%,
          rgba(255,68,157,.12) 68%,
          transparent 72%
        );
      box-shadow:
        0 0 11px rgba(255,68,157,.32);
      animation:
        thinkingPulse 1.8s ease-in-out infinite,
        pinkGlow 3s ease-in-out infinite;
    }
    /* =====================================================
       COMPOSER
    ===================================================== */
    .composer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding:
        12px
        16px
        max(14px, env(safe-area-inset-bottom));
      background:
        linear-gradient(
          to top,
          #050507 58%,
          rgba(5,5,7,.95) 78%,
          transparent
        );
    }
    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      max-width: 700px;
      margin: 0 auto;
    }
    #messageInput {
      flex: 1;
      min-height: 52px;
      max-height: 130px;
      resize: none;
      border-radius: 19px;
      border: 1px solid rgba(255,255,255,.085);
      background: rgba(255,255,255,.045);
      color: white;
      outline: none;
      padding: 15px 17px;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(18px);
      transition:
        border-color .25s ease,
        box-shadow .25s ease;
    }
    #messageInput:focus {
      border-color: rgba(255,105,184,.35);
      box-shadow:
        0 0 25px rgba(255,68,157,.055);
    }
    #messageInput::placeholder {
      color: rgba(255,255,255,.27);
    }
    #sendButton {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border: none;
      border-radius: 18px;
      background: #ff9dca;
      color: #070609;
      cursor: pointer;
      font-size: 19px;
      box-shadow:
        0 8px 25px rgba(255,68,157,.11);
      transition:
        transform .18s,
        opacity .18s,
        box-shadow .18s;
    }
    #sendButton:active {
      transform: scale(.94);
    }
    #sendButton:disabled {
      opacity: .32;
      cursor: default;
    }
    /* =====================================================
       TOAST
    ===================================================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      z-index: 300;
      transform:
        translate(-50%, 20px);
      padding: 11px 16px;
      border-radius: 13px;
      background: rgba(20,20,24,.94);
      border: 1px solid rgba(255,105,184,.12);
      box-shadow:
        0 15px 40px rgba(0,0,0,.35);
      color: rgba(255,255,255,.82);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      white-space: nowrap;
      backdrop-filter: blur(18px);
    }
    .toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }
    /* =====================================================
       ANIMAÇÕES
    ===================================================== */
    @keyframes auraPulse {
      0%,100% {
        transform: scale(1);
        filter: brightness(.92);
      }
      50% {
        transform: scale(1.018);
        filter: brightness(1.08);
      }
    }
    @keyframes pinkGlow {
      0%,100% {
        box-shadow:
          0 0 12px rgba(255,68,157,.12),
          0 0 30px rgba(255,68,157,.045);
      }
      50% {
        box-shadow:
          0 0 18px rgba(255,68,157,.22),
          0 0 42px rgba(255,68,157,.09);
      }
    }
    @keyframes corePulse {
      0%,100% {
        transform: scale(.88);
        opacity: .88;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }
    @keyframes miniPulse {
      0%,100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.045);
      }
    }
    @keyframes thinkingPulse {
      0%,100% {
        transform: scale(.78);
        opacity: .45;
      }
      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }
    @keyframes coreHalo {
      0%,100% {
        transform: scale(.92);
        opacity: .35;
      }
      50% {
        transform: scale(1.08);
        opacity: .68;
      }
    }
    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes wordReveal {
      from {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }
    @keyframes mistRotate {
      from {
        transform:
          translate(-50%, -50%)
          rotate(0deg)
          scale(.92);
      }
      to {
        transform:
          translate(-50%, -50%)
          rotate(360deg)
          scale(1.08);
      }
    }
    @keyframes mistPulse {
      0%,100% {
        filter: blur(22px) brightness(.8);
      }
      50% {
        filter: blur(28px) brightness(1.15);
      }
    }
    /* =====================================================
       MOBILE
    ===================================================== */
    @media (max-width: 600px) {
      .chat {
        padding-left: 14px;
        padding-right: 14px;
      }
      .message-content {
        max-width: 90%;
      }
      h1 {
        font-size: 34px;
      }
      .aura-core {
        width: 138px;
        height: 138px;
      }
      .core {
        width: 28px;
        height: 28px;
      }
      .side-menu {
        width: min(335px, 91vw);
      }
      .delete-history {
        opacity: .65;
      }
    }
  </style>
</head>
<body>
  <!-- =====================================================
       AUTH
  ===================================================== -->
  <div id="authScreen">
    <div class="auth-box">
      <div class="auth-core">
        <div class="auth-ring"></div>
        <div class="auth-core-dot"></div>
      </div>
      <div class="auth-title">
        AURA
      </div>
      <div class="auth-subtitle">
        intelligence for your story
      </div>
      <div class="auth-form">
        <input
          id="authEmail"
          class="auth-input"
          type="email"
          placeholder="Seu e-mail"
          autocomplete="email"
        >
        <input
          id="authPassword"
          class="auth-input"
          type="password"
          placeholder="Sua senha"
          autocomplete="current-password"
        >
        <button
          id="authButton"

      <div

      <button

  </div>
  <!-- =====================================================
       APP
  ===================================================== -->
  <main
    id="app"
    class="app"
    style="display:none;"
  >
    <div
      id="menuOverlay"
      class="menu-overlay"
      onclick="closeMenu()"
    ></div>
    <!-- ===================================================
         SIDE MENU
    =================================================== -->
    <aside
      id="sideMenu"
      class="side-menu"
    >
      <div class="menu-header">
        <div class="menu-logo">
          <div class="mini-core">
            <div class="mini-ring"></div>
            <div class="mini-dot"></div>
          </div>
          <div class="menu-logo-text">
            AURA
          </div>
        </div>
        <button
          class="close-menu"
          onclick="closeMenu()"
          aria-label="Fechar menu"
        >
          ×
        </button>
      </div>
      <button
        class="new-story-menu"

      >

          +
        </span>
        <span class="new-story-text">
          Nova história
        </span>
      </button>
      <div class="history-title">
        Suas histórias
      </div>
      <div
        id="historyList"
        class="history-list"
      ></div>
      <div class="account-area">
        <div class="account-card">
          <div
            id="accountAvatar"
            class="account-avatar"
          >
            A
          </div>
          <div class="account-info">
            <div class="account-label">
              CONTA
            </div>
            <div
              id="accountEmail"
              class="account-email"
            >
              —
            </div>
            <div
              id="accountCredits"
              class="account-credits"
            >
              Créditos: —
            </div>
          </div>
        </div>
        <button
          class="logout-button"

        </button>

    <!-- ===================================================
         TOPBAR
    =================================================== -->
    <header class="topbar">
      <button
        class="top-action"
        onclick="openMenu()"
        aria-label="Abrir histórias"
      >
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
      <div class="brand">
        <div class="mini-core">
          <div class="mini-ring"></div>
          <div class="mini-dot"></div>
        </div>
        <div class="brand-name">
          AURA
        </div>
      </div>
      <button
        class="top-action"
        onclick="newStory()"
        aria-label="Nova história"
      >
        <div class="plus-icon">
          +
        </div>
      </button>
    </header>
    <!-- ===================================================
         CHAT
    =================================================== -->
    <section
      id="chat"
      class="chat"
    >
      <div
        id="welcome"
        class="welcome"
      >
        <div class="aura-core">
          <div class="ring"></div>
          <div class="core"></div>
        </div>
        <h1>
          AURA
        </h1>
        <p class="tagline">
          intelligence for your story
        </p>
      </div>
    </section>
    <!-- ===================================================
         COMPOSER
    =================================================== -->
    <footer class="composer">
      <div class="composer-inner">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Comece uma história..."
          autocomplete="off"
        ></textarea>
        <button
          id="sendButton"
          onclick="sendMessage()"
          aria-label="Enviar"
        >
          ↑
        </button>
      </div>
    </footer>
  </main>
  <div
    id="toast"
    class="toast"
  ></div>
  <script>
    /* =====================================================
       SUPABASE
    ===================================================== */
    const SUPABASE_URL =
      "https://vqmfsshmjdfjlnmbemxv.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_nCCjJPHoTODWLHvwTWN_AA_J8JivYaE";
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    /* =====================================================
       STATE
    ===================================================== */
    let authMode = "login";
    let conversation = [];
    let isThinking = false;
    let currentStoryId = null;
    let stories = [];
    let currentUser = null;
    let appInitialized = false;
    let userCredits = 0;
    const chat =
      document.getElementById("chat");
    const input =
      document.getElementById("messageInput");
    const sendButton =
      document.getElementById("sendButton");
    /* =====================================================
       AUTH MODE
    ===================================================== */
    function toggleAuthMode() {
      const button =
        document.getElementById("authButton");
      const switchButton =
        document.getElementById("authSwitch");
      const subtitle =
        document.querySelector(".auth-subtitle");
      const message =
        document.getElementById("authMessage");
      message.textContent = "";
      message.className = "auth-error";
      if (authMode === "login") {
        authMode = "signup";
        button.textContent =
          "Criar conta";
        subtitle.textContent =
          "Crie sua conta e comece sua história.";
        switchButton.innerHTML =
          'Já tenho uma conta. <span>Entrar</span>';
      } else {
        authMode = "login";
        button.textContent =
          "Entrar";
        subtitle.textContent =
          "intelligence for your story";
        switchButton.innerHTML =
          'Ainda não tenho uma conta. <span>Criar conta</span>';
      }
    }
    /* =====================================================
       AUTH
    ===================================================== */
    async function handleAuth() {
      const email =
        document
          .getElementById("authEmail")
          .value
          .trim();
      const password =
        document
          .getElementById("authPassword")
          .value;
      const button =
        document.getElementById("authButton");
      const message =
        document.getElementById("authMessage");
      message.textContent = "";
      message.className = "auth-error";
      if (!email || !password) {
        message.textContent =
          "Preencha seu e-mail e sua senha.";
        return;
      }
      if (password.length < 6) {
        message.textContent =
          "A senha precisa ter pelo menos 6 caracteres.";
        return;
      }
      button.disabled = true;
      button.textContent =
        authMode === "login"
          ? "Entrando..."
          : "Criando...";
      try {
        if (authMode === "signup") {
          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({
              email,
              password
            });
          if (error) {
            throw error;
          }
          if (data.session) {
            currentUser =
              data.user;
            await showApp();
          } else {
            message.className =
              "auth-error auth-success";
            message.textContent =
              "Conta criada. Verifique seu e-mail para confirmar o cadastro.";
          }
        } else {
          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });
          if (error) {
            throw error;
          }
          currentUser =
            data.user;
          await showApp();
        }
      } catch (error) {
        console.error(error);
        message.textContent =
          translateAuthError(
            error.message
          );
      } finally {
        button.disabled = false;
        button.textContent =
          authMode === "login"
            ? "Entrar"
            : "Criar conta";
      }
    }
    function translateAuthError(error) {
      if (!error) {
        return "Não foi possível continuar.";
      }
      const text =
        error.toLowerCase();
      if (
        text.includes(
          "invalid login credentials"
        )
      ) {
        return "E-mail ou senha incorretos.";
      }
      if (
        text.includes(
          "user already registered"
        )
      ) {
        return "Esse e-mail já possui uma conta.";
      }
      if (
        text.includes("password")
      ) {
        return "Verifique sua senha.";
      }
      return error;
    }
    /* =====================================================
       APP
    ===================================================== */
    async function showApp() {
      if (
        appInitialized &&
        currentUser
      ) {
        return;
      }
      appInitialized = true;
      document.getElementById(
        "authScreen"
      ).style.display = "none";
      document.getElementById(
        "app"
      ).style.display = "block";
      if (!currentUser) {
        const { data } =
          await supabaseClient.auth.getUser();
        currentUser =
          data.user;
      }
      updateAccountUI();
      await loadCredits();
      await loadStories();
      setTimeout(() => {
        input.focus();
      }, 150);
    }
    async function checkSession() {
      const { data } =
        await supabaseClient.auth.getSession();
      if (data.session) {
        currentUser =
          data.session.user;
        await showApp();
      } else {
        document.getElementById(
          "authScreen"
        ).style.display = "flex";
      }
    }
    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {
        if (session) {
          currentUser =
            session.user;
          await showApp();
        } else if (
          event === "SIGNED_OUT"
        ) {
          appInitialized = false;
        }
      }
    );
    function updateAccountUI() {
      if (!currentUser) {
        return;
      }
      const email =
        currentUser.email ||
        "Conta Aura";
      const emailElement =
        document.getElementById(
          "accountEmail"
        );
      const avatar =
        document.getElementById(
          "accountAvatar"
        );
      emailElement.textContent =
        email;
      avatar.textContent =
        email
          .charAt(0)
          .toUpperCase();
      updateCreditsUI();
    }
    /* =====================================================
       CRÉDITOS
       TABELA: credits
       COLUNAS: user_id / balance
    ===================================================== */
    async function loadCredits() {
      if (!currentUser) {
        return;
      }
      try {
        const {
          data,
          error
        } =
          await supabaseClient
            .from("credits")
            .select("id, user_id, balance")
            .eq(
              "user_id",
              currentUser.id
            )
            .maybeSingle();
        if (error) {
          throw error;
        }
        /*
         * Se o usuário ainda não tiver uma linha
         * na tabela, criamos automaticamente
         * com 20 créditos.
         */
        if (!data) {
          const {
            data: newCredit,
            error: insertError
          } =
            await supabaseClient
              .from("credits")
              .insert({
                user_id:
                  currentUser.id,
                balance:
                  20
              })
              .select(
                "id, user_id, balance"
              )
              .single();
          if (insertError) {
            throw insertError;
          }
          userCredits =
            Number(
              newCredit.balance
            ) || 20;
        } else {
          userCredits =
            Number(
              data.balance
            ) || 0;
        }
        updateCreditsUI();
        updateSendButton();
      } catch (error) {
        console.error(
          "Erro ao carregar créditos:",
          error
        );
        userCredits = 0;
        updateCreditsUI();
        updateSendButton();
        showToast(
          "Não foi possível carregar seus créditos."
        );
      }
    }
    function updateCreditsUI() {
      const element =
        document.getElementById(
          "accountCredits"
        );
      if (!element) {
        return;
      }
      element.textContent =
        `Créditos: ${userCredits}`;
    }
    async function consumeCredit() {
      if (!currentUser) {
        return false;
      }
      if (userCredits <= 0) {
        return false;
      }
      const newCredits =
        userCredits - 1;
      try {
        const {
          data,
          error
        } =
          await supabaseClient
            .from("credits")
            .update({
              balance:
                newCredits
            })
            .eq(
              "user_id",
              currentUser.id
            )
            .select(
              "balance"
            )
            .single();
        if (error) {
          throw error;
        }
        userCredits =
          Number(
            data.balance
          ) || 0;
        updateCreditsUI();
        updateSendButton();
        return true;
      } catch (error) {
        console.error(
          "Erro ao consumir crédito:",
          error
        );
        return false;
      }
    }
    async function restoreCredit() {
      if (!currentUser) {
        return;
      }
      try {
        const newCredits =
          userCredits + 1;
        const {
          data,
          error
        } =
          await supabaseClient
            .from("credits")
            .update({
              balance:
                newCredits
            })
            .eq(
              "user_id",
              currentUser.id
            )
            .select(
              "balance"
            )
            .single();
        if (error) {
          throw error;
        }
        userCredits =
          Number(
            data.balance
          ) || newCredits;
        updateCreditsUI();
        updateSendButton();
      } catch (error) {
        console.error(
          "Erro ao devolver crédito:",
          error
        );
      }
    }
    function updateSendButton() {
      if (!sendButton) {
        return;
      }
      if (isThinking) {
        sendButton.disabled =
          true;
        return;
      }
      sendButton.disabled =
        userCredits <= 0;
    }
    /* =====================================================
       LOGOUT
    ===================================================== */
    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      conversation = [];
      currentStoryId = null;
      stories = [];
      userCredits = 0;
      appInitialized = false;
      closeMenu();
      document.getElementById(
        "app"
      ).style.display = "none";
      document.getElementById(
        "authScreen"
      ).style.display = "flex";
      document.getElementById(
        "authPassword"
      ).value = "";
      document.getElementById(
        "authMessage"
      ).textContent = "";
      resetChat();
      showToast(
        "Você saiu da conta."
      );
    }
    /* =====================================================
       STORIES
    ===================================================== */
    async function loadStories() {
      if (!currentUser) {
        return;
      }
      try {
        const {
          data,
          error
        } =
          await supabaseClient
            .from("stories")
            .select(
              "id, title, messages, created_at, updated_at"
            )
            .eq(
              "user_id",
              currentUser.id
            )
            .order(
              "updated_at",
              {
                ascending: false
              }
            );
        if (error) {
          throw error;
        }
        stories =
          (data || []).map(
            story => ({
              id:
                story.id,
              title:
                story.title ||
                "Nova história",
              messages:
                Array.isArray(
                  story.messages
                )
                  ? story.messages
                  : [],
              createdAt:
                story.created_at,
              updatedAt:
                story.updated_at
            })
          );
        renderHistory();
      } catch (error) {
        console.error(
          "Erro ao carregar histórias:",
          error
        );
        stories = [];
        renderHistory();
        showToast(
          "Não foi possível carregar suas histórias."
        );
      }
    }
    async function createStory() {
      if (!currentUser) {
        return null;
      }
      try {
        const {
          data,
          error
        } =
          await supabaseClient
            .from("stories")
            .insert({
              user_id:
                currentUser.id,
              title:
                "Nova história",
              messages:
                []
            })
            .select(
              "id, title, messages, created_at, updated_at"
            )
            .single();
        if (error) {
          throw error;
        }
        const story = {
          id:
            data.id,
          title:
            data.title,
          messages:
            data.messages || [],
          createdAt:
            data.created_at,
          updatedAt:
            data.updated_at
        };
        stories.unshift(story);
        currentStoryId =
          story.id;
        conversation = [];
        renderHistory();
        renderCurrentStory();
        closeMenu();
        input.focus();
        return story;
      } catch (error) {
        console.error(
          "Erro ao criar história:",
          error
        );
        showToast(
          "Não foi possível criar a história."
        );
        return null;
      }
    }
    function getCurrentStory() {
      return stories.find(
        story =>
          story.id ===
          currentStoryId
      );
    }
    async function saveCurrentConversation() {
      if (
        !currentStoryId ||
        !currentUser
      ) {
        return;
      }
      const story =
        getCurrentStory();
      if (!story) {
        return;
      }
      const messages =
        conversation.map(
          item => ({
            role:
              item.role,
            content:
              item.content
          })
        );
      const firstUser =
        conversation.find(
          item =>
            item.role === "user"
        );
      let title =
        story.title ||
        "Nova história";
      if (
        firstUser &&
        firstUser.content
      ) {
        title =
          createStoryTitle(
            firstUser.content
          );
      }
      try {
        const {
          data,
          error
        } =
          await supabaseClient
            .from("stories")
            .update({
              title:
                title,
              messages:
                messages,
              updated_at:
                new Date().toISOString()
            })
            .eq(
              "id",
              currentStoryId
            )
            .eq(
              "user_id",
              currentUser.id
            )
            .select(
              "id, title, messages, created_at, updated_at"
            )
            .single();
        if (error) {
          throw error;
        }
        story.title =
          data.title;
        story.messages =
          data.messages || [];
        story.createdAt =
          data.created_at;
        story.updatedAt =
          data.updated_at;
        renderHistory();
      } catch (error) {
        console.error(
          "Erro ao salvar história:",
          error
        );
        showToast(
          "Não foi possível salvar a história."
        );
      }
    }
    function createStoryTitle(text) {
      let title =
        text
          .replace(/\s+/g, " ")
          .trim();
      if (!title) {
        return "Nova história";
      }
      if (title.length > 34) {
        title =
          title.substring(
            0,
            34
          ).trim() +
          "...";
      }
      return title;
    }
    /* =====================================================
       HISTORY
    ===================================================== */
    function renderHistory() {
      const list =
        document.getElementById(
          "historyList"
        );
      if (!list) {
        return;
      }
      if (!stories.length) {
        list.innerHTML = `
          <div class="history-empty">
            Suas histórias aparecerão aqui.
            <br><br>
            Comece uma nova aventura.
          </div>
        `;
        return;
      }
      const ordered =
        [...stories].sort(
          (a, b) =>
            new Date(
              b.updatedAt
            ) -
            new Date(
              a.updatedAt
            )
        );
      list.innerHTML =
        ordered.map(
          story => {
            const active =
              story.id ===
              currentStoryId
                ? "active"
                : "";
            return `
              <div
                class="history-item ${active}"
                onclick="openStory('${story.id}')"
              >
                <div class="history-aura">
                  <div class="history-aura-ring"></div>
                  <div class="history-aura-dot"></div>
                </div>
                <div class="history-info">
                  <div class="history-name">
                    ${escapeHtml(story.title)}
                  </div>
                  <div class="history-date">
                    ${formatDate(story.updatedAt)}
                  </div>
                </div>
                <button
                  class="delete-history"
                  onclick="deleteStory(event, '${story.id}')"
                  aria-label="Apagar história"
                >
                  ×
                </button>
              </div>
            `;
          }
        )
        .join("");
    }
    async function openStory(id) {
      const story =
        stories.find(
          item =>
            item.id === id
        );
      if (!story) {
        return;
      }
      currentStoryId =
        story.id;
      conversation =
        Array.isArray(
          story.messages
        )
          ? story.messages.map(
              item => ({
                role:
                  item.role,
                content:
                  item.content
              })
            )
          : [];
      renderCurrentStory();
      renderHistory();
      closeMenu();
      input.placeholder =
        "Continue sua história...";
      input.focus();
    }
    function renderCurrentStory() {
      chat.innerHTML = "";
      if (!conversation.length) {
        chat.innerHTML = `
          <div
            id="welcome"
            class="welcome"
          >
            <div class="aura-core">
              <div class="ring"></div>
              <div class="core"></div>
            </div>
            <h1>AURA</h1>
            <p class="tagline">
              intelligence for your story
            </p>
          </div>
        `;
        return;
      }
      conversation.forEach(
        item => {
          if (
            item.role === "user"
          ) {
            addUserMessage(
              item.content,
              false
            );
          } else {
            addAuraInstant(
              item.content,
              false
            );
          }
        }
      );
      scrollToBottom();
    }
    async function deleteStory(
      event,
      id
    ) {
      event.stopPropagation();
      if (!currentUser) {
        return;
      }
      try {
        const {
          error
        } =
          await supabaseClient
            .from("stories")
            .delete()
            .eq(
              "id",
              id
            )
            .eq(
              "user_id",
              currentUser.id
            );
        if (error) {
          throw error;
        }
        stories =
          stories.filter(
            story =>
              story.id !== id
          );
        if (
          currentStoryId ===
          id
        ) {
          currentStoryId =
            null;
          conversation = [];
          input.placeholder =
            "Comece uma história...";
          renderCurrentStory();
        }
        renderHistory();
        showToast(
          "História apagada."
        );
      } catch (error) {
        console.error(
          "Erro ao apagar história:",
          error
        );
        showToast(
          "Não foi possível apagar a história."
        );
      }
    }
    function newStory() {
      conversation = [];
      currentStoryId = null;
      resetChat();
      closeMenu();
      input.value = "";
      resizeInput();
      input.placeholder =
        "Comece uma nova história...";
      input.focus();
      showToast(
        "Nova história."
      );
    }
    function resetChat() {
      chat.innerHTML = `
        <div
          id="welcome"
          class="welcome"
        >
          <div class="aura-core">
            <div class="ring"></div>
            <div class="core"></div>
          </div>
          <h1>AURA</h1>
          <p class="tagline">
            intelligence for your story
          </p>
        </div>
      `;
      renderHistory();
    }
    async function ensureStory() {
      if (currentStoryId) {
        const existing =
          getCurrentStory();
        if (existing) {
          return existing;
        }
      }
      return await createStory();
    }
    /* =====================================================
       CHAT
    ===================================================== */
    async function sendMessage() {
      if (isThinking) {
        return;
      }
      if (userCredits <= 0) {
        showToast(
          "Você não possui mais créditos."
        );
        updateSendButton();
        return;
      }
      const message =
        input.value.trim();
      if (!message) {
        return;
      }
      /*
       * Consome 1 crédito antes do envio.
       */
      const creditConsumed =
        await consumeCredit();
      if (!creditConsumed) {
        showToast(
          "Não foi possível usar seu crédito."
        );
        return;
      }
      const story =
        await ensureStory();
      if (!story) {
        await restoreCredit();
        return;
      }
      const currentWelcome =
        document.getElementById(
          "welcome"
        );
      if (currentWelcome) {
        currentWelcome.remove();
      }
      addUserMessage(message);
      conversation.push({
        role: "user",
        content: message
      });
      await saveCurrentConversation();
      input.value = "";
      resizeInput();
      setThinking(true);
      try {
        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  message:
                    message,
                  history:
                    conversation.slice(
                      0,
                      -1
                    )
                })
            }
          );
        const data =
          await response.json();
        if (!response.ok) {
          throw new Error(
            data.error ||
            "Erro ao conversar com a Aura"
          );
        }
        conversation.push({
          role:
            "assistant",
          content:
            data.reply
        });
        await saveCurrentConversation();
        setThinking(false);
        await streamAura(
          data.reply
        );
      } catch (error) {
        console.error(error);
        setThinking(false);
        /*
         * Devolve o crédito quando a API falhar.
         */
        await restoreCredit();
        addAuraInstant(
          "Não consegui responder agora. Tente novamente em alguns instantes."
        );
      }
    }
    /* =====================================================
       AURA MESSAGE
    ===================================================== */
    function addUserMessage(
      text,
      shouldScroll = true
    ) {
      const wrapper =
        document.createElement(
          "div"
        );
      wrapper.className =
        "message user";
      const content =
        document.createElement(
          "div"
        );
      content.className =
        "message-content";
      const bubble =
        document.createElement(
          "div"
        );
      bubble.className =
        "bubble";
      bubble.textContent =
        text;
      content.appendChild(
        bubble
      );
      wrapper.appendChild(
        content
      );
      chat.appendChild(
        wrapper
      );
      if (shouldScroll) {
        scrollToBottom();
      }
    }
    function addAuraInstant(
      text,
      shouldScroll = true
    ) {
      const wrapper =
        document.createElement(
          "div"
        );
      wrapper.className =
        "message aura";
      const content =
        document.createElement(
          "div"
        );
      content.className =
        "message-content";
      const label =
        document.createElement(
          "div"
        );
      label.className =
        "aura-label";
      label.textContent =
        "AURA";
      const bubble =
        document.createElement(
          "div"
        );
      bubble.className =
        "bubble";
      bubble.textContent =
        text;
      content.appendChild(
        label
      );
      content.appendChild(
        bubble
      );
      wrapper.appendChild(
        content
      );
      chat.appendChild(
        wrapper
      );
      if (shouldScroll) {
        scrollToBottom();
      }
    }
    /* =====================================================
       STREAMING
    ===================================================== */
    async function streamAura(text) {
      isThinking = true;
      sendButton.disabled =
        true;
      const wrapper =
        document.createElement(
          "div"
        );
      wrapper.className =
        "message aura streaming";
      const content =
        document.createElement(
          "div"
        );
      content.className =
        "message-content";
      const label =
        document.createElement(
          "div"
        );
      label.className =
        "aura-label";
      label.textContent =
        "AURA";
      const bubble =
        document.createElement(
          "div"
        );
      bubble.className =
        "bubble";
      const mist =
        document.createElement(
          "div"
        );
      mist.className =
        "mist";
      bubble.appendChild(
        mist
      );
      content.appendChild(
        label
      );
      content.appendChild(
        bubble
      );
      wrapper.appendChild(
        content
      );
      chat.appendChild(
        wrapper
      );
      const parts =
        text.split(
          /(\s+)/
        );
      const words =
        parts.filter(
          part =>
            part.trim().length > 0
        );
      let wordNumber = 0;
      for (
        const part of parts
      ) {
        if (!part) {
          continue;
        }
        if (
          part.trim() === ""
        ) {
          bubble.appendChild(
            document.createTextNode(
              part
            )
          );
          continue;
        }
        const word =
          document.createElement(
            "span"
          );
        word.className =
          "stream-word";
        word.textContent =
          part;
        bubble.appendChild(
          word
        );
        wordNumber++;
        const progress =
          wordNumber /
          words.length;
        mist.style.left =
          `${Math.min(
            8 + progress * 84,
            92
          )}%`;
        let delay = 105;
        if (
          part.endsWith(".") ||
          part.endsWith("!") ||
          part.endsWith("?")
        ) {
          delay = 360;
        } else if (
          part.endsWith(",") ||
          part.endsWith(";") ||
          part.endsWith(":")
        ) {
          delay = 210;
        }
        scrollToBottom();
        await wait(delay);
      }
      wrapper.classList.remove(
        "streaming"
      );
      wrapper.classList.add(
        "finished"
      );
      await wait(700);
      isThinking = false;
      updateSendButton();
      scrollToBottom();
    }
    function wait(ms) {
      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );
    }
    function scrollToBottom() {
      requestAnimationFrame(() => {
        chat.scrollTo({
          top:
            chat.scrollHeight,
          behavior:
            "smooth"
        });
      });
    }
    /* =====================================================
       THINKING
    ===================================================== */
    function setThinking(
      thinking
    ) {
      isThinking =
        thinking;
      const old =
        document.getElementById(
          "thinking"
        );
      if (old) {
        old.remove();
      }
      if (!thinking) {
        updateSendButton();
        return;
      }
      sendButton.disabled =
        true;
      const element =
        document.createElement(
          "div"
        );
      element.id =
        "thinking";
      element.className =
        "thinking";
      element.innerHTML = `
        <div class="thinking-core"></div>
        <span>
          A Aura está pensando...
        </span>
      `;
      chat.appendChild(
        element
      );
      scrollToBottom();
    }
    /* =====================================================
       INPUT
    ===================================================== */
    input.addEventListener(
      "input",
      resizeInput
    );
    function resizeInput() {
      input.style.height =
        "auto";
      input.style.height =
        Math.min(
          input.scrollHeight,
          130
        ) + "px";
    }
    input.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
    /* =====================================================
       MENU
    ===================================================== */
    function openMenu() {
      document
        .getElementById(
          "sideMenu"
        )
        .classList.add(
          "open"
        );
      document
        .getElementById(
          "menuOverlay"
        )
        .classList.add(
          "open"
        );
      renderHistory();
      updateCreditsUI();
    }
    function closeMenu() {
      document
        .getElementById(
          "sideMenu"
        )
        .classList.remove(
          "open"
        );
      document
        .getElementById(
          "menuOverlay"
        )
        .classList.remove(
          "open"
        );
    }
    /* =====================================================
       HELPERS
    ===================================================== */
    function formatDate(
      timestamp
    ) {
      const date =
        new Date(
          timestamp
        );
      const now =
        new Date();
      const sameDay =
        date.toDateString() ===
        now.toDateString();
      if (sameDay) {
        return (
          "Hoje · " +
          date.toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        );
      }
      return date.toLocaleDateString(
        "pt-BR",
        {
          day: "2-digit",
          month: "short"
        }
      );
    }
    function escapeHtml(
      text
    ) {
      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }
    function showToast(
      text
    ) {
      const toast =
        document.getElementById(
          "toast"
        );
      toast.textContent =
        text;
      toast.classList.add(
        "show"
      );
      clearTimeout(
        window.auraToastTimer
      );
      window.auraToastTimer =
        setTimeout(
          () => {
            toast.classList.remove(
              "show"
            );
          },
          1800
        );
    }
    /* =====================================================
       START
    ===================================================== */
    checkSession();
  </script>
</body>
</html>
