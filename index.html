<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>RIMAK</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --bg:#050507;
      --bg2:#09090d;
      --panel:#0d0d12;
      --panel2:#111117;
      --white:#fafafa;
      --text:rgba(255,255,255,.90);
      --muted:rgba(255,255,255,.45);
      --faint:rgba(255,255,255,.22);
      --line:rgba(255,255,255,.075);
      --line2:rgba(255,255,255,.12);
      --pink:#ff4fa3;
      --pink2:#ff83bd;
      --purple:#9b7cff;
      --danger:#ff719e;
    }

    html,body{
      width:100%;
      height:100%;
      background:var(--bg);
      color:white;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body{
      overflow:hidden;
    }

    button,input,textarea{
      font:inherit;
    }

    button{
      border:0;
      -webkit-tap-highlight-color:transparent;
    }

    /* =====================================================
       AUTH
    ===================================================== */

    let enteringApp = false;

    function setAuthMessage(message, success=false){
      authMessage.className =
        success ? "auth-error auth-success" : "auth-error";
      authMessage.textContent = message || "";
    }

    function translateAuthError(error){
      const raw = error?.message || error || "";
      const text = String(raw).toLowerCase();

      if(text.includes("auth_library_not_loaded")){
        return "O serviço de login não carregou. Atualize a página e tente novamente.";
      }

      if(text.includes("invalid login credentials")){
        return "E-mail ou senha incorretos.";
      }

      if(text.includes("email not confirmed")){
        return "Confirme seu e-mail antes de entrar.";
      }

      if(text.includes("user already registered")){
        return "Esse e-mail já possui uma conta.";
      }

      if(text.includes("password")){
        return "A senha precisa ter pelo menos 6 caracteres.";
      }

      if(text.includes("rate limit") || text.includes("too many requests")){
        return "Muitas tentativas. Aguarde alguns minutos e tente novamente.";
      }

      if(text.includes("failed to fetch") || text.includes("network")){
        return "Não foi possível conectar ao serviço de login. Verifique sua internet e tente novamente.";
      }

      if(text.includes("session_not_created")){
        return "O login foi aceito, mas a sessão não pôde ser criada. Tente novamente.";
      }

      return String(raw) || "Não foi possível continuar.";
    }

    async function finishAuthenticatedUser(user){
      if(!user) throw new Error("USER_NOT_FOUND");

      currentUser = user;

      if(enteringApp) return;
      enteringApp = true;

      try{
        authScreen.style.display = "none";
        app.style.display = "block";

        loadRIMAKMemory();
        updateAccountUI();
        loadStories();
        await loadCredits();

        setTimeout(() => {
          if(typeof input !== "undefined" && input) input.focus();
        },150);
      }finally{
        enteringApp = false;
      }
    }

    async function loginWithFallback(email,password){
      const client = getSupabaseClient();

      try{
        const { data, error } =
          await client.auth.signInWithPassword({
            email,
            password
          });

        if(!error && data?.session && data?.user){
          return { session:data.session, user:data.user };
        }

        if(error) throw error;
      }catch(sdkError){
        console.warn("RIMAK AUTH SDK fallback:", sdkError);

        const restData =
          await authRest(
            "/auth/v1/token?grant_type=password",
            {email,password}
          );

        const session =
          await establishSession(restData);

        return {
          session,
          user:session.user || restData.user
        };
      }

      throw new Error("SESSION_NOT_CREATED");
    }

    async function signupWithFallback(email,password){
      const client = getSupabaseClient();

      try{
        const { data, error } =
          await client.auth.signUp({
            email,
            password
          });

        if(error) throw error;

        return data;
      }catch(sdkError){
        console.warn("RIMAK SIGNUP SDK fallback:", sdkError);

        return await authRest(
          "/auth/v1/signup",
          {email,password}
        );
      }
    }

    authForm.addEventListener("submit", handleAuth);

    async function handleAuth(event){
      event.preventDefault();

      if(authButton.disabled) return;

      const email = authEmail.value.trim().toLowerCase();
      const password = authPassword.value;

      if(!email || !password){
        setAuthMessage("Preencha e-mail e senha.");
        return;
      }

      if(password.length < 6){
        setAuthMessage("A senha precisa ter pelo menos 6 caracteres.");
        return;
      }

      authButton.disabled = true;
      authMessage.textContent = "";
      authButton.textContent =
        authMode === "login" ? "Entrando..." : "Criando...";

      try{
        if(authMode === "signup"){
          const data =
            await signupWithFallback(email,password);

          if(data?.session && data?.user){
            await finishAuthenticatedUser(data.user);
          }else{
            setAuthMessage(
              "Conta criada. Verifique seu e-mail para confirmar.",
              true
            );
          }

          return;
        }

        const result =
          await loginWithFallback(email,password);

        await finishAuthenticatedUser(result.user);

      }catch(error){
        console.error("RIMAK AUTH:",error);
        setAuthMessage(translateAuthError(error));
      }finally{
        authButton.disabled = false;
        authButton.textContent =
          authMode === "login" ? "Entrar" : "Criar conta";
      }
    }

    async function checkSession(){
      try{
        const client = getSupabaseClient();
        const { data, error } =
          await client.auth.getSession();

        if(error) throw error;

        if(data?.session?.user){
          await finishAuthenticatedUser(data.session.user);
          return;
        }
      }catch(error){
        console.warn("RIMAK SESSION:",error);
      }

      currentUser = null;
      authScreen.style.display = "flex";
      app.style.display = "none";
    }

    getSupabaseClient().auth.onAuthStateChange(
      (event,session) => {
        if(
          session?.user &&
          (event === "SIGNED_IN" ||
           event === "TOKEN_REFRESHED" ||
           event === "INITIAL_SESSION")
        ){
          currentUser = session.user;

          if(
            event !== "INITIAL_SESSION" &&
            !enteringApp &&
            authScreen.style.display !== "none"
          ){
            finishAuthenticatedUser(session.user).catch(error => {
              console.error("RIMAK AUTH STATE:",error);
            });
          }
        }

        if(event === "SIGNED_OUT"){
          currentUser = null;
        }
      }
    );

    async function showApp(){
      if(currentUser){
        await finishAuthenticatedUser(currentUser);
        return;
      }

      const { data } =
        await getSupabaseClient().auth.getUser();

      if(data?.user){
        await finishAuthenticatedUser(data.user);
      }else{
        authScreen.style.display = "flex";
        app.style.display = "none";
      }
    }

    /* =====================================================
       ACCOUNT
    ===================================================== */

    function updateAccountUI(){

      if(!currentUser){
        return;
      }

      const email =
        currentUser.email ||
        "Conta RIMAK";

      document.getElementById(
        "accountEmail"
      ).textContent =
        email;

      document.getElementById(
        "accountAvatar"
      ).textContent =
        email
          .charAt(0)
          .toUpperCase();

    }


    async function logout(){

      await getSupabaseClient().auth.signOut();

      currentUser = null;

      conversation = [];

      stories = [];

      currentStoryId = null;

      auraMemory = {
        preferences:[],
        importantPeople:[],
        goals:[],
        importantFacts:[],
        emotionalPatterns:[]
      };

      closeMenu();

      app.style.display =
        "none";

      authScreen.style.display =
        "flex";

      authPassword.value = "";

      authMessage.textContent =
        "";

      resetChat();

      showToast(
        "Você saiu da conta."
      );

    }


    /* =====================================================
       RIMAK PERSONAL MEMORY
       -----------------------------------------------------
       Estrutura local preparada para a memória personalizada.
       A memória real entre dispositivos/conversas deverá ser
       persistida no Supabase/backend.
    ===================================================== */

    function memoryKey(){

      if(!currentUser){
        return null;
      }

      return (
        "aura_memory_" +
        currentUser.id
      );

    }


    function loadRIMAKMemory(){

      const key =
        memoryKey();

      if(!key){
        return;
      }

      try{

        const saved =
          localStorage.getItem(key);

        if(saved){

          const parsed =
            JSON.parse(saved);

          auraMemory = {
            preferences:
              Array.isArray(
                parsed.preferences
              )
                ? parsed.preferences
                : [],

            importantPeople:
              Array.isArray(
                parsed.importantPeople
              )
                ? parsed.importantPeople
                : [],

            goals:
              Array.isArray(
                parsed.goals
              )
                ? parsed.goals
                : [],

            importantFacts:
              Array.isArray(
                parsed.importantFacts
              )
                ? parsed.importantFacts
                : [],

            emotionalPatterns:
              Array.isArray(
                parsed.emotionalPatterns
              )
                ? parsed.emotionalPatterns
                : []
          };

        }

      }catch(error){

        console.error(
          "Erro ao carregar memória da RIMAK:",
          error
        );

      }

    }


    function saveRIMAKMemory(){

      const key =
        memoryKey();

      if(!key){
        return;
      }

      try{

        localStorage.setItem(
          key,
          JSON.stringify(
            auraMemory
          )
        );

      }catch(error){

        console.error(
          "Erro ao salvar memória da RIMAK:",
          error
        );

      }

    }


    /*
      Essa função não tenta "adivinhar" fatos pessoais.
      Ela apenas registra sinais simples e seguros da conversa
      para que o contexto possa ser enviado ao backend.
    */

    function learnFromUserMessage(message){

      const text =
        String(message || "")
          .trim();

      if(!text){
        return;
      }

      const lower =
        text.toLowerCase();

      const preferencePatterns = [
        "eu gosto de ",
        "eu adoro ",
        "eu prefiro ",
        "gosto de ",
        "adoro ",
        "prefiro ",
        "não gosto de ",
        "nao gosto de ",
        "odeio "
      ];

      const hasPreference =
        preferencePatterns.some(
          pattern =>
            lower.includes(pattern)
        );

      if(hasPreference){

        const clean =
          text
            .replace(/\s+/g," ")
            .trim();

        if(
          !auraMemory.preferences.includes(
            clean
          )
        ){

          auraMemory.preferences.unshift(
            clean
          );

          auraMemory.preferences =
            auraMemory.preferences.slice(
              0,
              20
            );

        }

      }

      const goalPatterns = [
        "quero conseguir ",
        "quero aprender ",
        "meu objetivo é ",
        "meu objetivo e ",
        "quero fazer ",
        "quero criar ",
        "estou tentando "
      ];

      if(
        goalPatterns.some(
          pattern =>
            lower.includes(pattern)
        )
      ){

        if(
          !auraMemory.goals.includes(
            text
          )
        ){

          auraMemory.goals.unshift(
            text
          );

          auraMemory.goals =
            auraMemory.goals.slice(
              0,
              15
            );

        }

      }

      const emotionalSignals = [
        "estou feliz",
        "tô feliz",
        "to feliz",
        "estou triste",
        "tô triste",
        "to triste",
        "estou preocupado",
        "tô preocupado",
        "to preocupado",
        "estou ansioso",
        "tô ansioso",
        "to ansioso",
        "estou animado",
        "tô animado",
        "to animado",
        "estou com raiva",
        "tô com raiva",
        "to com raiva"
      ];

      emotionalSignals.forEach(
        signal => {

          if(
            lower.includes(signal)
          ){

            if(
              !auraMemory.emotionalPatterns.includes(
                signal
              )
            ){

              auraMemory.emotionalPatterns.unshift(
                signal
              );

              auraMemory.emotionalPatterns =
                auraMemory.emotionalPatterns.slice(
                  0,
                  15
                );

            }

          }

        }
      );

      saveRIMAKMemory();

    }


    function buildRIMAKContext(){

      return {

        memory:{
          preferences:
            auraMemory.preferences.slice(
              0,
              10
            ),

          importantPeople:
            auraMemory.importantPeople.slice(
              0,
              10
            ),

          goals:
            auraMemory.goals.slice(
              0,
              10
            ),

          importantFacts:
            auraMemory.importantFacts.slice(
              0,
              10
            ),

          emotionalPatterns:
            auraMemory.emotionalPatterns.slice(
              0,
              10
            )
        },

        behavior:{
          understandEmotion:true,
          adaptTone:true,
          maintainPersonality:true,
          rememberRelevantContext:true,
          learnFromUser:true,
          preserveConversationContinuity:true
        }

      };

    }


    /* =====================================================
       CREDITS
    ===================================================== */

    async function loadCredits(){

      if(!currentUser){
        return;
      }

      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .from("credits")
            .select("balance")
            .eq(
              "user_id",
              currentUser.id
            )
            .maybeSingle();

        if(error){
          throw error;
        }
                if(data){

          credits =
            Number(
              data.balance ?? 0
            );

        }else{

          const {
            data:created,
            error:createError
          } =
            await supabaseClient
              .from("credits")
              .insert({
                user_id:
                  currentUser.id,
                balance:20
              })
              .select("balance")
              .single();

          if(createError){
            throw createError;
          }

          credits =
            Number(
              created?.balance ?? 20
            );

        }

      }catch(error){

        console.error(
          "Erro ao carregar créditos:",
          error
        );

      }

      updateCreditsUI();

    }


    function updateCreditsUI(){

      creditsCount.textContent =
        String(
          Math.max(
            0,
            Number(credits || 0)
          )
        );

      modalCreditsCount.textContent =
        String(
          Math.max(
            0,
            Number(credits || 0)
          )
        );

    }


    /* =====================================================
       STORIES / HISTORY
    ===================================================== */

    function storageKey(){

      if(!currentUser){
        return null;
      }

      return (
        "aura_line_stories_" +
        currentUser.id
      );

    }


    function loadStories(){

      const key =
        storageKey();

      if(!key){
        return;
      }

      try{

        const saved =
          localStorage.getItem(key);

        stories =
          saved
            ? JSON.parse(saved)
            : [];

      }catch{

        stories = [];

      }

      renderHistory();

    }


    function saveStories(){

      const key =
        storageKey();

      if(!key){
        return;
      }

      localStorage.setItem(
        key,
        JSON.stringify(stories)
      );

      renderHistory();

    }


    function createStory(){

      const story = {

        id:
          "story_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2),

        title:
          "Nova conversa",

        messages:[],

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      };

      stories.unshift(story);

      currentStoryId =
        story.id;

      conversation = [];

      saveStories();

      renderCurrentStory();

      closeMenu();

      input.focus();

      return story;

    }


    function getCurrentStory(){

      return stories.find(
        story =>
          story.id ===
          currentStoryId
      );

    }


    function saveCurrentConversation(){

      if(!currentStoryId){
        return;
      }

      const story =
        getCurrentStory();

      if(!story){
        return;
      }

      story.messages =
        conversation.map(
          item => ({
            role:item.role,
            content:item.content
          })
        );

      story.updatedAt =
        Date.now();

      const firstUser =
        conversation.find(
          item =>
            item.role === "user"
        );

      if(firstUser){

        story.title =
          firstUser.content
            .replace(/\s+/g," ")
            .trim()
            .slice(0,45);

      }

      stories =
        [
          story,
          ...stories.filter(
            item =>
              item.id !==
              story.id
          )
        ];

      saveStories();

    }


    function ensureStory(){

      if(currentStoryId){

        const existing =
          getCurrentStory();

        if(existing){
          return existing;
        }

      }

      return createStory();

    }


    function renderHistory(){

      historyList.innerHTML =
        "";

      if(!stories.length){

        historyList.innerHTML =
          `
            <div class="history-empty">
              Suas conversas aparecerão aqui.
            </div>
          `;

        return;

      }

      stories
        .slice(0,50)
        .forEach(story => {

          const item =
            document.createElement("div");

          item.className =
            "history-item" +
            (
              story.id ===
              currentStoryId
                ? " active"
                : ""
            );

          const date =
            new Date(
              story.updatedAt ||
              story.createdAt
            );

          item.innerHTML =
            `
              <div class="history-symbol"></div>

              <div class="history-info">
                <div class="history-name">
                  ${escapeHTML(
                    story.title ||
                    "Nova conversa"
                  )}
                </div>

                <div class="history-date">
                  ${date.toLocaleDateString(
                    "pt-BR",
                    {
                      day:"2-digit",
                      month:"2-digit"
                    }
                  )}
                </div>
              </div>

              <button
                class="delete-history"
                type="button"
                aria-label="Excluir"
              >
                ×
              </button>
            `;

          item.addEventListener(
            "click",
            event => {

              if(
                event.target.closest(
                  ".delete-history"
                )
              ){
                return;
              }

              openStory(
                story.id
              );

            }
          );

          item
            .querySelector(
              ".delete-history"
            )
            .addEventListener(
              "click",
              event => {

                event.stopPropagation();

                deleteStory(
                  story.id
                );

              }
            );

          historyList.appendChild(
            item
          );

        });

    }


    function openStory(id){

      const story =
        stories.find(
          item =>
            item.id === id
        );

      if(!story){
        return;
      }

      currentStoryId =
        story.id;

      conversation =
        Array.isArray(
          story.messages
        )
          ? [...story.messages]
          : [];

      renderCurrentStory();

      closeMenu();

    }


    function deleteStory(id){

      stories =
        stories.filter(
          story =>
            story.id !== id
        );

      if(
        currentStoryId === id
      ){

        currentStoryId =
          null;

        conversation =
          [];

        resetChat();

      }

      saveStories();

    }


    function renderCurrentStory(){

      chat.innerHTML =
        "";

      if(!conversation.length){

        chat.appendChild(
          welcome
        );

        welcome.style.display =
          "flex";

        return;

      }

      welcome.style.display =
        "none";

      conversation.forEach(
        message => {

          addMessage(
            message.role,
            message.content,
            false
          );

        }
      );

      scrollToBottom();

    }


    /* =====================================================
       CHAT
    ===================================================== */

    async function sendMessage(){

      if(isThinking){
        return;
      }

      const message =
        input.value.trim();

      if(!message){
        return;
      }

      if(!currentUser){

        showToast(
          "Entre na sua conta primeiro."
        );

        return;
      }

      if(credits <= 0){

        openModal(
          "plansModal"
        );

        showToast(
          "Seus créditos acabaram."
        );

        return;

      }

      isThinking = true;

      sendButton.disabled =
        true;

      input.value =
        "";

      autoResize();

      ensureStory();

      welcome.style.display =
        "none";

      conversation.push({
        role:"user",
        content:message
      });

      /*
        A RIMAK aprende sinais relevantes da conversa.
        O backend deverá transformar esse contexto em
        memória persistente real.
      */
      learnFromUserMessage(
        message
      );

      addMessage(
        "user",
        message
      );

      const thinking =
        addThinking();

      try{

        let session = null;

        const refreshed =
          await getSupabaseClient().auth.refreshSession();

        if(
          refreshed.data?.session
        ){

          session =
            refreshed.data.session;

        }else{

          const currentSession =
            await getSupabaseClient().auth.getSession();

          session =
            currentSession.data?.session ||
            null;

        }

        if(
          !session?.access_token
        ){

          throw new Error(
            "Sessão expirada. Entre novamente."
          );

        }

        const response =
          await fetch(
            "/api/chat",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "Authorization":
                                    `Bearer ${session.access_token}`
              },

              body:
                JSON.stringify({

                  message,

                  history:
                    conversation.slice(
                      0,
                      -1
                    ),

                  language:
                    (loadSettings().language || "pt-BR"),

                  plan:
                    "free",

                  auraContext:
                    buildRIMAKContext()

                })

            }
          );

        const data =
          await response
            .json()
            .catch(
              () => ({})
            );

        if(!response.ok){

          if(
            response.status === 401
          ){

            throw new Error(
              "A autenticação da RIMAK foi recusada pelo servidor. Tente entrar novamente."
            );

          }

          if(
            response.status === 402
          ){

            if(
              typeof data.credits ===
              "number"
            ){

              credits =
                data.credits;

            }else{

              await loadCredits();

            }

            updateCreditsUI();

            openModal(
              "plansModal"
            );

            throw new Error(
              data.error ||
              "Seus créditos acabaram."
            );

          }

          throw new Error(
            data.error ||
            "Erro na API."
          );

        }

        if(
          typeof data.credits ===
          "number"
        ){

          credits =
            data.credits;

          updateCreditsUI();

        }else{

          await loadCredits();

        }

        /*
          Se o backend futuramente retornar memórias
          aprendidas de forma estruturada, elas podem
          ser incorporadas aqui sem alterar o visual.
        */

        if(
          data.memory &&
          typeof data.memory === "object"
        ){

          if(
            Array.isArray(
              data.memory.preferences
            )
          ){

            auraMemory.preferences =
              data.memory.preferences.slice(
                0,
                20
              );

          }

          if(
            Array.isArray(
              data.memory.importantPeople
            )
          ){

            auraMemory.importantPeople =
              data.memory.importantPeople.slice(
                0,
                20
              );

          }

          if(
            Array.isArray(
              data.memory.goals
            )
          ){

            auraMemory.goals =
              data.memory.goals.slice(
                0,
                20
              );

          }

          if(
            Array.isArray(
              data.memory.importantFacts
            )
          ){

            auraMemory.importantFacts =
              data.memory.importantFacts.slice(
                0,
                20
              );

          }

          if(
            Array.isArray(
              data.memory.emotionalPatterns
            )
          ){

            auraMemory.emotionalPatterns =
              data.memory.emotionalPatterns.slice(
                0,
                20
              );

          }

          saveRIMAKMemory();

        }

        const reply =
          String(
            data.reply || ""
          );

        thinking.remove();

        if(!reply){

          throw new Error(
            "A RIMAK não retornou uma resposta."
          );

        }

        conversation.push({
          role:"assistant",
          content:reply
        });

        await streamRIMAK(
          reply,
          Array.isArray(data.sources) ? data.sources : []
        );

        saveCurrentConversation();

      }catch(error){

        console.error(error);

        if(
          thinking &&
          thinking.isConnected
        ){

          thinking.remove();

        }

        addMessage(
          "aura",
          error?.message ||
          "Não consegui responder agora. Tente novamente em alguns instantes."
        );

      }finally{

        isThinking = false;

        sendButton.disabled =
          false;

        input.focus();

      }

    }


    function addMessage(
      role,
      text,
      shouldScroll=true
    ){

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "message " +
        (
          role === "user"
            ? "user"
            : "aura"
        );

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "message-content";

      if(role !== "user"){

        const label =
          document.createElement(
            "div"
          );

        label.className =
          "aura-label";

        label.textContent =
          "RIMAK";

        content.appendChild(
          label
        );

      }

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      if(role === "user"){
        bubble.textContent = String(text || "");
      }else{
        bubble.innerHTML = renderMarkdown(text);
      }

      content.appendChild(
        bubble
      );

      wrapper.appendChild(
        content
      );

      chat.appendChild(
        wrapper
      );

      if(shouldScroll){

        scrollToBottom();

      }

      return wrapper;

    }

    async function streamRIMAK(text, sources = []){

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "message aura";

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "message-content";

      const label =
        document.createElement(
          "div"
        );

      label.className =
        "aura-label";

      label.textContent =
        "RIMAK";

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      content.appendChild(
        label
      );

      content.appendChild(
        bubble
      );

      wrapper.appendChild(
        content
      );

      chat.appendChild(
        wrapper
      );

      const words =
        String(text)
          .split(/(\s+)/);

      let output = "";

      for(
        let i=0;
        i<words.length;
        i++
      ){

        output +=
          words[i];

        bubble.innerHTML =
          renderMarkdown(output);

        if(
          i % 3 === 0
        ){

          scrollToBottom();

          await sleep(
            18
          );

        }

      }

      if(Array.isArray(sources) && sources.length){
        const sourceBox=document.createElement("div");
        sourceBox.className="aura-sources";
        const title=document.createElement("div");
        title.className="aura-sources-title";
        title.textContent="FONTES";
        sourceBox.appendChild(title);
        sources.slice(0,5).forEach(source=>{
          if(!source?.url)return;
          const link=document.createElement("a");
          link.className="aura-source";
          link.href=source.url;
          link.target="_blank";
          link.rel="noopener noreferrer";
          link.textContent=source.title || source.url;
          sourceBox.appendChild(link);
        });
        if(sourceBox.children.length>1) content.appendChild(sourceBox);
      }

      scrollToBottom();

    }

      input.style.height =
        Math.min(
          input.scrollHeight,
          150
        ) +
        "px";

    }


    input.addEventListener(
      "input",
      autoResize
    );


    input.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          sendMessage();

        }

      }
    );


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =====================================================
       SUGGESTIONS
    ===================================================== */

    document
      .querySelectorAll(
        ".suggestion"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              input.value =
                button.dataset.prompt;

              autoResize();

              sendMessage();

            }
          );

        }
      );


    /* =====================================================
       HELPERS
    ===================================================== */

    function renderMarkdown(value){
      const lines=String(value||"").replace(/\r/g,"").split("\n");
      let html="",listType=null;
      const close=()=>{if(listType){html+=`</${listType}>`;listType=null;}};
      for(const raw of lines){
        const line=raw.trimEnd();
        if(!line.trim()){close();continue;}
        const m=line.match(/^\s*[-*]\s+(.+)$/)||line.match(/^\s*\d+[.)]\s+(.+)$/);
        if(m){
          const type=/^\s*[-*]/.test(line)?"ul":"ol";
          if(listType!==type){close();html+=`<${type}>`;listType=type;}
          html+=`<li>${formatInlineMarkdown(m[1])}</li>`;continue;
        }
        close();
        const h=line.match(/^\s*(#{1,3})\s+(.+)$/);
        html+=h?`<h${h[1].length}>${formatInlineMarkdown(h[2])}</h${h[1].length}>`:`<p>${formatInlineMarkdown(line)}</p>`;
      }
      close();return html||"<p></p>";
    }
    function formatInlineMarkdown(value){
      let s=escapeHTML(value),links=[];
      s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>{
        const token=`@@LINK${links.length}@@`;
        links.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);return token;
      });
      s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
      s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/_([^_]+)_/g,"<em>$1</em>");
      links.forEach((link,i)=>{s=s.replace(`@@LINK${i}@@`,link);});return s;
    }

    function escapeHTML(value){

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       INIT
    ===================================================== */

    loadSettings();
    checkSession();


  </script>
