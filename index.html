<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Line</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #15151d 0%, #08080c 42%, #030304 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px;
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(130, 100, 255, 0.10);
      filter: blur(80px);
      animation: breathe 5s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 430px;
      animation: appear 1s ease;
    }

    .aura-core {
      width: 150px;
      height: 150px;
      margin: 0 auto 38px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow:
        0 0 25px rgba(160,130,255,0.25),
        inset 0 0 25px rgba(160,130,255,0.10);
      animation: pulse 4s ease-in-out infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .core {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 12px white,
        0 0 35px rgba(170,140,255,0.9),
        0 0 70px rgba(130,100,255,0.55);
      animation: corePulse 3s ease-in-out infinite;
    }

    h1 {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 8px;
      margin-bottom: 14px;
    }

    .tagline {
      color: rgba(255,255,255,0.62);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 38px;
    }

    .primary {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 18px;
      background: white;
      color: #08080c;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .primary:active {
      transform: scale(.97);
    }

    .secondary {
      margin-top: 18px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      cursor: pointer;
    }

    .footer {
      position: absolute;
      bottom: 25px;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      letter-spacing: .4px;
    }

    input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: .65;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @keyframes corePulse {
      0%, 100% {
        transform: scale(.85);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(.9);
        opacity: .6;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="glow"></div>

    <section class="content">

      <div class="aura-core">
        <div class="ring"></div>
        <div class="core"></div>
      </div>

      <h1>AURA</h1>

      <p class="tagline">
        Sua história começa aqui.
        <br>
        Crie. Escolha. Viva.
      </p>

      <button class="primary" onclick="startStory()">
        ✦ Começar uma história
      </button>

      <button class="secondary" onclick="login()">
        Entrar
      </button>

    </section>

    <div class="footer">
      AURA LINE
    </div>

  </main>

  <script>

    let conversation = [];


    function startStory() {

      document.querySelector(".content").innerHTML = `

        <div class="aura-core">
          <div class="ring"></div>
          <div class="core"></div>
        </div>

        <h1>COMEÇAR</h1>

        <p class="tagline">
          Que história você quer viver?
        </p>

        <input
          id="storyInput"
          type="text"
          placeholder="Ex: Quero ser piloto de F1..."
          autocomplete="off"
          style="
            width:100%;
            height:58px;
            border-radius:18px;
            border:1px solid rgba(255,255,255,.15);
            background:rgba(255,255,255,.06);
            color:white;
            padding:0 18px;
            font-size:15px;
            outline:none;
            margin-bottom:14px;
          "
        >

        <button class="primary" onclick="createStory()">
          ✦ Criar história
        </button>

      `;

      setTimeout(() => {
        document.getElementById("storyInput").focus();
      }, 100);

    }


    async function createStory() {

      const input = document.getElementById("storyInput");

      const story = input.value.trim();

      if (!story) {
        input.focus();
        return;
      }

      conversation = [
        {
          role: "user",
          content: story
        }
      ];

      showThinking();

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: story,
            history: []
          })

        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erro ao conversar com a Aura");
        }

        conversation.push({
          role: "assistant",
          content: data.reply
        });

        showResponse(data.reply);

      } catch (error) {

        console.error(error);

        showError();

      }

    }


    function showThinking() {

      document.querySelector(".content").innerHTML = `

        <div class="aura-core">
          <div class="ring"></div>
          <div class="core"></div>
        </div>

        <h1>AURA</h1>

        <p class="tagline">
          A Aura está pensando...
        </p>

      `;

    }


    function showResponse(reply) {

      document.querySelector(".content").innerHTML = `

        <div class="aura-core">
          <div class="ring"></div>
          <div class="core"></div>
        </div>

        <h1>AURA</h1>

        <div
          style="
            color:rgba(255,255,255,.82);
            font-size:15px;
            line-height:1.7;
            margin-bottom:30px;
            max-height:260px;
            overflow-y:auto;
            text-align:left;
            white-space:pre-wrap;
          "
        >${escapeHtml(reply)}</div>

        <button class="primary" onclick="continueStory()">
          Continuar
        </button>

      `;

    }


    function continueStory() {

      document.querySelector(".content").innerHTML = `

        <div class="aura-core">
          <div class="ring"></div>
          <div class="core"></div>
        </div>

        <h1>AURA</h1>

        <p class="tagline">
          Continue sua história...
        </p>

        <input
          id="continueInput"
          type="text"
          placeholder="O que acontece agora?"
          autocomplete="off"
          style="
            width:100%;
            height:58px;
            border-radius:18px;
            border:1px solid rgba(255,255,255,.15);
            background:rgba(255,255,255,.06);
            color:white;
            padding:0 18px;
            font-size:15px;
            outline:none;
            margin-bottom:14px;
          "
        >

        <button class="primary" onclick="sendMessage()">
          Enviar
        </button>

      `;

      setTimeout(() => {
        document.getElementById("continueInput").focus();
      }, 100);

    }


    async function sendMessage() {

      const input = document.getElementById("continueInput");

      const message = input.value.trim();

      if (!message) {
        input.focus();
        return;
      }

      conversation.push({
        role: "user",
        content: message
      });

      showThinking();

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message,
            history: conversation.slice(0, -1)
          })

        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erro ao conversar com a Aura");
        }

        conversation.push({
          role: "assistant",
          content: data.reply
        });

        showResponse(data.reply);

      } catch (error) {

        console.error(error);

        showError();

      }

    }


    function showError() {

      document.querySelector(".content").innerHTML = `

        <div class="aura-core">
          <div class="ring"></div>
          <div class="core"></div>
        </div>

        <h1>AURA</h1>

        <p class="tagline">
          Não consegui falar com você agora.
          <br><br>
          Tente novamente em alguns instantes.
        </p>

        <button class="primary" onclick="location.reload()">
          Tentar novamente
        </button>

      `;

    }


    function login() {

      alert("Login da Aura Line em breve.");

    }


    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
