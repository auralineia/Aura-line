<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">
  <title>Aura Line</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #050507;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(130, 100, 255, 0.16),
          transparent 40%
        ),
        #050507;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 82px;

      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        max(16px, env(safe-area-inset-top))
        18px
        12px;

      background:
        linear-gradient(
          to bottom,
          rgba(5,5,7,.96),
          rgba(5,5,7,.72),
          transparent
        );

      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-core {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-ring {
      position: absolute;
      inset: 0;

      border-radius: 50%;

      border: 1px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff7bd5,
          #9d8cff,
          #65d9ff,
          #8affc1,
          #ffdc7a,
          #ff7bd5
        ) border-box;

      animation:
        colorSpin 5s linear infinite,
        miniPulse 3s ease-in-out infinite;

      box-shadow:
        0 0 15px rgba(150,120,255,.25);
    }

    .mini-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 10px white,
        0 0 20px rgba(160,130,255,.9);
    }

    .brand-name {
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 500;
    }

    .menu-button {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 14px;

      background: rgba(255,255,255,.06);

      color: rgba(255,255,255,.7);

      cursor: pointer;

      font-size: 19px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        105px
        18px
        120px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 10px;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: calc(100vh - 220px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px 0;
    }

    /* =========================
       AURA CORE
    ========================= */

    .aura-core {
      width: 150px;
      height: 150px;

      margin-bottom: 34px;

      border-radius: 50%;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;

      inset: 0;

      border-radius: 50%;

      border: 2px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff79d1,
          #a887ff,
          #66d8ff,
          #73ffd1,
          #ffe27a,
          #ff8ac8,
          #a887ff,
          #ff79d1
        ) border-box;

      animation:
        colorSpin 6s linear infinite,
        auraPulse 4s ease-in-out infinite;

      box-shadow:
        0 0 12px rgba(255,120,210,.25),
        0 0 30px rgba(130,100,255,.20),
        0 0 55px rgba(90,210,255,.12);
    }

    .ring::before {
      content: "";

      position: absolute;

      inset: 9px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.18);

      box-shadow:
        inset 0 0 20px rgba(255,255,255,.05);
    }

    .ring::after {
      content: "";

      position: absolute;

      inset: -10px;

      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          transparent,
          rgba(255,100,210,.45),
          transparent,
          rgba(90,210,255,.35),
          transparent,
          rgba(150,120,255,.4),
          transparent
        );

      filter: blur(12px);

      opacity: .55;

      z-index: -1;

      animation: colorSpin 8s linear infinite;
    }

    .core {
      width: 31px;
      height: 31px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,.95),
        0 0 50px rgba(170,140,255,.9),
        0 0 85px rgba(110,170,255,.5);

      animation: corePulse 3s ease-in-out infinite;
    }

    /* =========================
       TEXT
    ========================= */

    h1 {
      font-size: 38px;

      font-weight: 500;

      letter-spacing: 8px;

      margin-bottom: 14px;
    }

    .tagline {
      color: rgba(255,255,255,.62);

      font-size: 15px;

      line-height: 1.65;

      margin-bottom: 30px;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      display: flex;

      margin-bottom: 18px;

      animation: messageAppear .35s ease;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.aura {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 86%;

      padding: 14px 16px;

      border-radius: 20px;

      font-size: 15px;

      line-height: 1.65;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .message.user .bubble {
      background: rgba(255,255,255,.10);

      border:
        1px solid
        rgba(255,255,255,.08);

      border-bottom-right-radius: 6px;

      color: rgba(255,255,255,.94);
    }

    .message.aura .bubble {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.055),
          rgba(130,100,255,.055)
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      border-bottom-left-radius: 6px;

      color: rgba(255,255,255,.86);
    }

    .aura-label {
      font-size: 10px;

      letter-spacing: 3px;

      color: rgba(255,255,255,.35);

      margin-bottom: 7px;

      padding-left: 4px;
    }

    /* =========================
       THINKING
    ========================= */

    .thinking {
      display: flex;

      align-items: center;

      gap: 9px;

      color: rgba(255,255,255,.42);

      font-size: 13px;

      margin: 12px 0 20px 5px;
    }

    .thinking-core {
      width: 20px;
      height: 20px;

      border-radius: 50%;

      border: 1px solid transparent;

      background:
        linear-gradient(#050507,#050507) padding-box,
        conic-gradient(
          from 0deg,
          #ff7bd5,
          #8e7cff,
          #65d9ff,
          #ff7bd5
        ) border-box;

      animation:
        colorSpin 1.5s linear infinite,
        thinkingPulse 1s ease-in-out infinite;
    }

    /* =========================
       INPUT AREA
    ========================= */

    .composer {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 30;

      padding:
        12px
        16px
        max(14px, env(safe-area-inset-bottom));

      background:
        linear-gradient(
          to top,
          #050507 60%,
          rgba(5,5,7,.94) 78%,
          transparent
        );
    }

    .composer-inner {
      display: flex;

      align-items: flex-end;

      gap: 9px;

      max-width: 700px;

      margin: 0 auto;
    }

    #messageInput {
      flex: 1;

      min-height: 52px;
      max-height: 130px;

      resize: none;

      border-radius: 20px;

      border:
        1px solid
        rgba(255,255,255,.11);

      background:
        rgba(255,255,255,.065);

      color: white;

      outline: none;

      padding:
        15px
        17px;

      font-size: 15px;

      line-height: 1.4;

      backdrop-filter: blur(15px);
    }

    #messageInput::placeholder {
      color: rgba(255,255,255,.30);
    }

    #sendButton {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      border: none;

      border-radius: 18px;

      background: white;

      color: #07070a;

      cursor: pointer;

      font-size: 19px;

      transition:
        transform .18s,
        opacity .18s;
    }

    #sendButton:active {
      transform: scale(.94);
    }

    #sendButton:disabled {
      opacity: .35;

      cursor: default;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes colorSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes auraPulse {
      0%,100% {
        transform: scale(1);

        filter:
          brightness(.85);
      }

      50% {
        transform: scale(1.045);

        filter:
          brightness(1.25);
      }
    }

    @keyframes corePulse {
      0%,100% {
        transform: scale(.85);

        opacity: .88;
      }

      50% {
        transform: scale(1.12);

        opacity: 1;
      }
    }

    @keyframes miniPulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes thinkingPulse {
      0%,100% {
        transform: scale(.75);

        opacity: .45;
      }

      50% {
        transform: scale(1.15);

        opacity: 1;
      }
    }

    @keyframes messageAppear {
      from {
        opacity: 0;

        transform:
          translateY(8px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .chat {
        padding-left: 14px;
        padding-right: 14px;
      }

      .bubble {
        max-width: 90%;
      }

      h1 {
        font-size: 34px;
      }

      .aura-core {
        width: 135px;
        height: 135px;
      }

      .core {
        width: 28px;
        height: 28px;
      }

    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =====================
         TOP BAR
    ====================== -->

    <header class="topbar">

      <div class="brand">

        <div class="mini-core">
          <div class="mini-ring"></div>
          <div class="mini-dot"></div>
        </div>

        <div class="brand-name">
          AURA
        </div>

      </div>

      <button
        class="menu-button"
        onclick="newStory()"
        aria-label="Nova história"
      >
        +
      </button>

    </header>


    <!-- =====================
         CHAT
    ====================== -->

    <section
      id="chat"
      class="chat"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <div class="aura-core">

          <div class="ring"></div>

          <div class="core"></div>

        </div>

        <h1>AURA</h1>

        <p class="tagline">
          Sua história começa aqui.
          <br>
          Crie. Escolha. Viva.
        </p>

      </div>

    </section>


    <!-- =====================
         COMPOSER
    ====================== -->

    <footer class="composer">

      <div class="composer-inner">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Comece uma história..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendButton"
          onclick="sendMessage()"
          aria-label="Enviar"
        >
          ↑
        </button>

      </div>

    </footer>

  </main>


  <script>

    /* =========================
       STATE
    ========================= */

    let conversation = [];

    let isThinking = false;


    /* =========================
       ELEMENTS
    ========================= */

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const welcome =
      document.getElementById("welcome");


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      if (isThinking) {
        return;
      }

      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      if (welcome) {
        welcome.remove();
      }

      addMessage(
        "user",
        message
      );

      conversation.push({
        role: "user",
        content: message
      });

      input.value = "";

      resizeInput();

      setThinking(true);

      try {

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              message: message,

              history:
                conversation.slice(0, -1)

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erro ao conversar com a Aura"
          );

        }


        conversation.push({

          role: "assistant",

          content: data.reply

        });


        setThinking(false);


        addMessage(
          "aura",
          data.reply
        );


      } catch (error) {

        console.error(error);

        setThinking(false);

        addMessage(
          "aura",
          "Não consegui responder agora. Tente novamente em alguns instantes."
        );

      }

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(
      role,
      text
    ) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        `message ${role}`;


      if (role === "aura") {

        const label =
          document.createElement("div");

        label.className =
          "aura-label";

        label.textContent =
          "AURA";

        const bubble =
          document.createElement("div");

        bubble.className =
          "bubble";

        bubble.textContent =
          text;


        const container =
          document.createElement("div");

        container.appendChild(label);

        container.appendChild(bubble);

        wrapper.appendChild(container);


      } else {

        const bubble =
          document.createElement("div");

        bubble.className =
          "bubble";

        bubble.textContent =
          text;

        wrapper.appendChild(
          bubble
        );

      }


      chat.appendChild(
        wrapper
      );


      scrollToBottom();

    }


    /* =========================
       THINKING
    ========================= */

    function setThinking(
      thinking
    ) {

      isThinking =
        thinking;

      sendButton.disabled =
        thinking;


      const oldThinking =
        document.getElementById(
          "thinking"
        );

      if (oldThinking) {
        oldThinking.remove();
      }


      if (!thinking) {
        return;
      }


      const element =
        document.createElement("div");

      element.id =
        "thinking";

      element.className =
        "thinking";


      element.innerHTML = `

        <div class="thinking-core"></div>

        <span>
          A Aura está pensando...
        </span>

      `;


      chat.appendChild(
        element
      );


      scrollToBottom();

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

      requestAnimationFrame(() => {

        chat.scrollTo({

          top:
            chat.scrollHeight,

          behavior:
            "smooth"

        });

      });

    }


    /* =========================
       TEXTAREA
    ========================= */

    input.addEventListener(
      "input",
      resizeInput
    );


    function resizeInput() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          130
        ) + "px";

    }


    /* =========================
       ENTER
    ========================= */

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       NEW STORY
    ========================= */

    function newStory() {

      conversation = [];

      chat.innerHTML = `

        <div
          id="welcome"
          class="welcome"
        >

          <div class="aura-core">

            <div class="ring"></div>

            <div class="core"></div>

          </div>

          <h1>AURA</h1>

          <p class="tagline">
            Sua história começa aqui.
            <br>
            Crie. Escolha. Viva.
          </p>

        </div>

      `;

      input.value = "";

      resizeInput();

      input.placeholder =
        "Comece uma nova história...";

      input.focus();

    }


    /* =========================
       START
    ========================= */

    input.focus();

  </script>

</body>
</html>
