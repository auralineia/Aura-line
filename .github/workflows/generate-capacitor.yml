name: Generate RIMAK Native Projects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'api/**'
      - '.github/workflows/generate-capacitor.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Android and iOS projects
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync

      - name: Commit native projects
        run: |
          git config user.name "RIMAK Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android ios package-lock.json
          if git diff --cached --quiet; then
            echo "No native project changes."
          else
            git commit -m "Generate RIMAK Android and iOS projects"
            git push
          fi
